<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Aviator Master Engine - Live 24/7</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #070a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .platform-container {
            width: 100%;
            max-width: 480px;
            background: #000000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #1a2233;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111726;
            padding: 10px 15px;
            border-bottom: 1px solid #1f2a40;
        }
        .brand { color: #ff334b; font-weight: 900; font-style: italic; font-size: 18px; }
        .balance-view { font-size: 13px; font-weight: bold; color: #00e676; }
        
        /* History Bar */
        .history-strip {
            display: flex;
            gap: 6px;
            padding: 6px 12px;
            background: #0b0f17;
            overflow-x: auto;
            border-bottom: 1px solid #1a2233;
        }
        .pill {
            background: #161f30;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #00bcd4;
            white-space: nowrap;
        }

        /* Full Screen Canvas Game Area */
        .game-viewport {
            position: relative;
            width: 100%;
            height: 260px;
            background: radial-gradient(circle at center, #260a18 0%, #070a12 75%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #1a2233;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .center-status {
            position: absolute;
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 51, 75, 0.8);
            z-index: 10;
            text-align: center;
        }

        /* Dual Betting Section */
        .betting-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background: #0f141f;
        }
        .bet-card {
            background: #161e30;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #222e48;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .input-group {
            display: flex;
            align-items: center;
            background: #0b0f17;
            border-radius: 8px;
            border: 1px solid #283654;
            overflow: hidden;
            width: 130px;
        }
        .input-group button {
            background: #1b263f;
            color: #fff;
            border: none;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            outline: none;
        }
        .btn-action {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: 900;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            background: #00c853;
            color: #070a12;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
            transition: 0.2s;
        }
        .btn-action.cashout {
            background: #ffab00;
            box-shadow: 0 4px 15px rgba(255, 171, 0, 0.3);
        }
        .quick-chips {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 8px;
        }
        .chip {
            background: #1f2b44;
            color: #a0aec0;
            border: none;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="platform-container">
        <!-- Top Navigation -->
        <div class="header-nav">
            <div class="brand">BX Aviator</div>
            <div class="balance-view" id="user-wallet">1000.00 BDT</div>
        </div>

        <!-- History Strip -->
        <div class="history-strip" id="history-bar">
            <span class="pill">1.20x</span>
            <span class="pill">2.45x</span>
            <span class="pill">1.08x</span>
        </div>

        <!-- Full Canvas Viewport -->
        <div class="game-viewport">
            <canvas id="mainCanvas"></canvas>
            <div class="center-status" id="status-display">CONNECTING...</div>
        </div>

        <!-- Dual Betting Panels -->
        <div class="betting-area">
            <!-- Panel 1 -->
            <div class="bet-card">
                <div class="bet-row">
                    <div class="input-group">
                        <button onclick="changeAmt(1, -10)">-</button>
                        <input type="number" id="b1-val" value="50">
                        <button onclick="changeAmt(1, 10)">+</button>
                    </div>
                    <button class="btn-action" id="b1-btn" onclick="onBetClick(1)">BET</button>
                </div>
                <div class="quick-chips">
                    <button class="chip" onclick="setQuick(1, 50)">50</button>
                    <button class="chip" onclick="setQuick(1, 100)">100</button>
                    <button class="chip" onclick="setQuick(1, 200)">200</button>
                    <button class="chip" onclick="setQuick(1, 500)">500</button>
                </div>
            </div>

            <!-- Panel 2 -->
            <div class="bet-card">
                <div class="bet-row">
                    <div class="input-group">
                        <button onclick="changeAmt(2, -10)">-</button>
                        <input type="number" id="b2-val" value="100">
                        <button onclick="changeAmt(2, 10)">+</button>
                    </div>
                    <button class="btn-action" id="b2-btn" onclick="onBetClick(2)">BET</button>
                </div>
                <div class="quick-chips">
                    <button class="chip" onclick="setQuick(2, 50)">50</button>
                    <button class="chip" onclick="setQuick(2, 100)">100</button>
                    <button class="chip" onclick="setQuick(2, 200)">200</button>
                    <button class="chip" onclick="setQuick(2, 500)">500</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let balance = 1000.00;
        let gameState = 'COUNTDOWN'; // COUNTDOWN, FLYING, CRASHED
        let multiplier = 1.00;
        let crashTarget = 1.00;
        let progress = 0;
        let countdownSec = 5;

        let activeBets = { 1: false, 2: false };
        let cashedOut = { 1: false, 2: false };
        let betAmounts = { 1: 0, 2: 0 };
        let loopInterval = null;

        function renderScene(mult, state) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background Sunburst Rays
            let cx = canvas.width / 2, cy = canvas.height / 2;
            ctx.save();
            ctx.translate(cx, cy);
            for (let i = 0; i < 14; i++) {
                let angle = (i * Math.PI * 2) / 14 + (progress * 0.001);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, Math.max(canvas.width, canvas.height), angle, angle + 0.12);
                ctx.fillStyle = i % 2 === 0 ? 'rgba(50, 10, 30, 0.35)' : 'rgba(15, 5, 12, 0.15)';
                ctx.fill();
            }
            ctx.restore();

            if (state === 'FLYING' || state === 'CRASHED') {
                // Red glowing trajectory under curve inside full canvas
                let grad = ctx.createLinearGradient(0, canvas.height, canvas.width, 0);
                grad.addColorStop(0, 'rgba(255, 51, 75, 0.0)');
                grad.addColorStop(1, 'rgba(255, 51, 75, 0.6)');
                ctx.fillStyle = grad;

                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                let px = progress * 2.2;
                let py = canvas.height - (progress * 1.15);
                ctx.quadraticCurveTo(px / 2, canvas.height, px, Math.max(30, py));
                ctx.lineTo(px, canvas.height);
                ctx.closePath();
                ctx.fill();

                // Flight Curve Line
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                ctx.quadraticCurveTo(px / 2, canvas.height, px, Math.max(30, py));
                ctx.strokeStyle = state === 'CRASHED' ? '#ff334b' : '#ff1744';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Red Plane Icon at tip
                ctx.fillStyle = '#ff334b';
                ctx.beginPath();
                ctx.arc(px, Math.max(30, py), 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Master 24/7 Autonomous Game Engine
        function startMasterEngine() {
            gameState = 'COUNTDOWN';
            countdownSec = 5;
            cashedOut = { 1: false, 2: false };
            progress = 0;
            multiplier = 1.00;

            document.getElementById('status-display').innerText = `NEXT ROUND\n0.0${countdownSec}s`;
            document.getElementById('status-display').style.color = "#00e676";
            renderScene(1.00, 'COUNTDOWN');

            let cdTimer = setInterval(() => {
                countdownSec--;
                if (countdownSec > 0) {
                    document.getElementById('status-display').innerText = `NEXT ROUND\n0.0${countdownSec}s`;
                } else {
                    clearInterval(cdTimer);
                    triggerFlightRound();
                }
            }, 1000);
        }

        function triggerFlightRound() {
            gameState = 'FLYING';
            crashTarget = (Math.random() * 5.0 + 1.10).toFixed(2);

            loopInterval = setInterval(() => {
                if (multiplier >= crashTarget) {
                    clearInterval(loopInterval);
                    gameState = 'CRASHED';
                    document.getElementById('status-display').innerText = `FLEW AWAY\n${crashTarget}x`;
                    document.getElementById('status-display').style.color = "#ff334b";

                    // Process uncashed user bets as lost
                    [1, 2].forEach(id => {
                        if (activeBets[id] && !cashedOut[id]) {
                            activeBets[id] = false;
                            resetButton(id);
                        }
                    });

                    setTimeout(startMasterEngine, 3500); // Auto-loop next round
                } else {
                    multiplier += 0.015;
                    progress += 2.0;
                    document.getElementById('status-display').innerText = `${multiplier.toFixed(2)}x`;
                    document.getElementById('status-display').style.color = "#ffffff";
                    renderScene(multiplier, 'FLYING');
                }
            }, 40);
        }

        function changeAmt(id, val) {
            let input = document.getElementById(`b${id}-val`);
            let current = parseFloat(input.value) || 0;
            if (current + val >= 1) input.value = current + val;
        }

        function setQuick(id, val) {
            document.getElementById(`b${id}-val`).value = val;
        }

        function onBetClick(id) {
            let btn = document.getElementById(`b${id}-btn`);
            let amountInput = parseFloat(document.getElementById(`b${id}-val`).value);

            if ((gameState === 'COUNTDOWN' || gameState === 'CRASHED') && !activeBets[id]) {
                if (amountInput <= 0 || amountInput > balance) return alert("Insufficient balance!");
                
                betAmounts[id] = amountInput;
                balance -= betAmounts[id];
                document.getElementById('user-wallet').innerText = balance.toFixed(2) + " BDT";
                activeBets[id] = true;
                cashedOut[id] = false;

                btn.innerText = "WAITING...";
                btn.style.background = "#e53935";

            } else if (gameState === 'FLYING' && activeBets[id] && !cashedOut[id]) {
                cashedOut[id] = true;
                let winAmount = (betAmounts[id] * multiplier) * 0.98; // Master API company profit calculation
                balance += winAmount;
                document.getElementById('user-wallet').innerText = balance.toFixed(2) + " BDT";

                btn.innerText = `WON ${winAmount.toFixed(0)}`;
                btn.style.background = "#00e676";
                activeBets[id] = false;
            }
        }

        function resetButton(id) {
            let btn = document.getElementById(`b${id}-btn`);
            btn.innerText = "BET";
            btn.style.background = "#00c853";
        }

        startMasterEngine();
    </script>
</body>
</html>
