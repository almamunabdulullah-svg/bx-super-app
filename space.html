<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Aviator Pro - Ultimate Edition</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #060913;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 950px;
            background: #0f1624;
            border: 2px solid #1f2b44;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141d30;
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .history-pills {
            display: flex;
            gap: 6px;
        }
        .pill {
            background: #1d2b48;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #00ffcc;
        }
        .content-area {
            display: flex;
            gap: 15px;
        }
        @media(max-width: 768px) {
            .content-area { flex-direction: column; }
        }
        .game-viewport {
            flex: 2.5;
            position: relative;
            width: 100%;
            height: 350px;
            background: radial-gradient(circle at center, #1b0c2e 0%, #070a14 100%);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #263859;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .multiplier-center {
            position: absolute;
            font-size: 58px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.9);
            z-index: 10;
            text-align: center;
        }
        .live-panel {
            flex: 1;
            background: #121929;
            border-radius: 10px;
            padding: 12px;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #1f2b44;
        }
        .control-panel {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            background: #121929;
            padding: 15px;
            border-radius: 10px;
            align-items: center;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }
        label { font-size: 10px; color: #8c9ebf; font-weight: bold; }
        input {
            background: #090d17;
            border: 1px solid #263859;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            width: 100%;
            text-align: center;
            outline: none;
        }
        .btn-main {
            flex: 1.5;
            padding: 14px;
            font-size: 16px;
            font-weight: 900;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        #action-button { background: #00c853; color: #060913; }
        #action-button.cashout { background: #ffab00; color: #060913; }
        .player-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            padding: 6px 0;
            border-bottom: 1px solid #1f2b44;
            color: #a3b5d5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <div>Balance: <span id="user-balance" style="color:#00ffcc; font-weight:bold;">1000.00</span> BDT</div>
            <div class="history-pills" id="history-box">
                <span class="pill">1.42x</span>
                <span class="pill">2.15x</span>
                <span class="pill">1.10x</span>
            </div>
        </div>

        <div class="content-area">
            <div class="game-viewport">
                <canvas id="gameCanvas"></canvas>
                <div class="multiplier-center" id="multiplier-label">WAITING...</div>
            </div>

            <div class="live-panel" id="live-sidebar">
                <div style="font-size:11px; font-weight:bold; color:#8c9ebf; margin-bottom:8px; border-bottom:1px solid #1f2b44; padding-bottom:4px;">LIVE ROUND BETS</div>
            </div>
        </div>

        <div class="control-panel">
            <div class="input-group">
                <label>BET AMOUNT (BDT)</label>
                <input type="number" id="bet-amount" value="50" min="1">
            </div>
            <button id="action-button" class="btn-main" onclick="handleGameAction()">PLACE BET</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let balance = 1000.00;
        let gameState = 'WAITING'; // WAITING, FLYING, CRASHED
        let currentMultiplier = 1.00;
        let crashMultiplier = 1.00;
        let progress = 0;
        let userBetPlaced = false;
        let userCashedOut = false;
        let currentBetVal = 0;
        let roundInterval = null;

        const fakeUsersList = ["CryptoPro", "Rahim_99", "AlphaX", "LuckyWin", "King77", "MoonRider", "FastJet", "BD_Trader"];

        function drawGameGraphics(mult, state) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dynamic grid & background star particles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            for(let i = 0; i < 30; i++) {
                let px = (i * 40 + progress * 2.5) % canvas.width;
                let py = (i * 25) % canvas.height;
                ctx.fillRect(px, py, 2, 2);
            }

            if(state === 'FLYING' || state === 'CRASHED') {
                // Vibrant red-pink glowing area under curve
                let gradient = ctx.createLinearGradient(0, canvas.height, canvas.width, 0);
                gradient.addColorStop(0, 'rgba(255, 0, 85, 0.0)');
                gradient.addColorStop(1, 'rgba(255, 0, 85, 0.4)');
                ctx.fillStyle = gradient;

                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                let curX = progress * 2.6;
                let curY = canvas.height - (progress * 1.35);
                ctx.quadraticCurveTo(curX / 2, canvas.height, curX, Math.max(35, curY));
                ctx.lineTo(curX, canvas.height);
                ctx.closePath();
                ctx.fill();

                // Flight trajectory curve line
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                ctx.quadraticCurveTo(curX / 2, canvas.height, curX, Math.max(35, curY));
                ctx.strokeStyle = state === 'CRASHED' ? '#ff1744' : '#ff0055';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Glowing Plane Tip VFX
                ctx.fillStyle = state === 'CRASHED' ? '#ff1744' : '#00ffcc';
                ctx.beginPath();
                ctx.arc(curX, Math.max(35, curY), 7, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function runGameLoop() {
            gameState = 'WAITING';
            currentMultiplier = 1.00;
            progress = 0;
            userCashedOut = false;
            document.getElementById('multiplier-label').innerText = "NEXT ROUND IN 3s";
            document.getElementById('multiplier-label').style.color = "#00ffcc";
            drawGameGraphics(1.00, 'WAITING');

            setTimeout(() => {
                gameState = 'FLYING';
                crashMultiplier = (Math.random() * 5.2 + 1.12).toFixed(2);
                loadLivePlayers();

                roundInterval = setInterval(() => {
                    if(currentMultiplier >= crashMultiplier) {
                        clearInterval(roundInterval);
                        gameState = 'CRASHED';
                        document.getElementById('multiplier-label').innerText = "FLEW AWAY!\n" + crashMultiplier + "x";
                        document.getElementById('multiplier-label').style.color = "#ff1744";

                        if(userBetPlaced && !userCashedOut) {
                            userBetPlaced = false;
                            resetButtonState();
                        }

                        setTimeout(runGameLoop, 3500);
                    } else {
                        currentMultiplier += 0.015;
                        progress += 2.2;
                        document.getElementById('multiplier-label').innerText = currentMultiplier.toFixed(2) + "x";
                        document.getElementById('multiplier-label').style.color = "#ffffff";
                        drawGameGraphics(currentMultiplier, 'FLYING');
                    }
                }, 40);
            }, 3000);
        }

        function loadLivePlayers() {
            const panel = document.getElementById('live-sidebar');
            panel.innerHTML = '<div style="font-size:11px; font-weight:bold; color:#8c9ebf; margin-bottom:8px; border-bottom:1px solid #1f2b44; padding-bottom:4px;">LIVE ROUND BETS</div>';
            for(let i = 0; i < 6; i++) {
                let name = fakeUsersList[Math.floor(Math.random() * fakeUsersList.length)];
                let amount = Math.floor(Math.random() * 500 + 50);
                panel.innerHTML += `<div class="player-row"><span>${name}</span><span>${amount} BDT</span></div>`;
            }
        }

        function handleGameAction() {
            let btn = document.getElementById('action-button');

            if(gameState === 'WAITING' || gameState === 'CRASHED') {
                let amt = parseFloat(document.getElementById('bet-amount').value);
                if(amt <= 0 || amt > balance) return alert("Invalid amount or low balance!");

                currentBetVal = amt;
                balance -= currentBetVal;
                document.getElementById('user-balance').innerText = balance.toFixed(2);
                userBetPlaced = true;
                userCashedOut = false;

                btn.innerText = "WAITING...";
                btn.disabled = true;

                setTimeout(() => {
                    if(gameState === 'FLYING' && userBetPlaced) {
                        btn.innerText = "CASH OUT";
                        btn.className = "btn-main cashout";
                        btn.disabled = false;
                    }
                }, 3000);

            } else if(gameState === 'FLYING' && userBetPlaced && !userCashedOut) {
                userCashedOut = true;
                let payout = (currentBetVal * currentMultiplier) * 0.98; // Master API company cut
                balance += payout;
                document.getElementById('user-balance').innerText = balance.toFixed(2);

                btn.innerText = "WON " + payout.toFixed(0) + " BDT";
                btn.className = "btn-main";
                btn.disabled = true;
                userBetPlaced = false;
            }
        }

        function resetButtonState() {
            let btn = document.getElementById('action-button');
            if(!userBetPlaced) {
                btn.innerText = "PLACE BET";
                btn.className = "btn-main";
                btn.disabled = false;
            }
        }

        runGameLoop();
    </script>
</body>
</html>
