<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super App - Global Finance & Gaming</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container 8d-depth">
        <!-- Header Section -->
        <header class="app-header">
            <div class="user-profile">
                <span class="avatar-badge">BX</span>
                <span class="user-id">ID: 889921</span>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Global Search (Coins, Features, Games)...">
            </div>
            <div class="selectors">
                <select id="langSelect"><option>EN</option><option>BN</option></select>
                <select id="currencySelect"><option>USD</option><option>BDT</option></select>
            </div>
        </header>

        <!-- Main Dashboard -->
        <main class="dashboard-main">
            <div class="asset-ad-box">
                <div class="total-asset-card">
                    <h3>Total Assets</h3>
                    <p class="balance-val">$50,430.00</p>
                </div>
                <div class="google-ad-box">
                    <span>Sponsored Ad (High-CPC)</span>
                </div>
            </div>

            <!-- Tiles Grid Menu -->
            <div class="tiles-grid">
                <div class="tile-item" onclick="location.href='game.html'">🎮 Game & Casino Zone</div>
                <div class="tile-item">💱 P2P Trading Hub</div>
                <div class="tile-item">🪙 Meme Coin Auto-List</div>
                <div class="tile-item">🏦 BX Secure Banking</div>
                <div class="tile-item">🌐 Social-Fi Hub</div>
                <div class="tile-item">🔒 Secret Admin Vault</div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
