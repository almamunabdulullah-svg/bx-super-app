<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super-App - Native Game Vault</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .game-card { height: 180px; }
    </style>
</head>
<body class="bg-[#0b0e14] text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center">

    <!-- Top Header -->
    <header class="w-full max-w-md bg-[#0f172a]/95 backdrop-blur-md border-b border-slate-800 p-3.5 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <div class="bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black px-3 py-1 rounded-xl text-lg tracking-wider shadow-md">
                BX
            </div>
            <span class="font-black text-sm tracking-widest text-white">NATIVE VAULT</span>
        </div>
        <div class="bg-emerald-500/10 border border-emerald-500/30 px-2.5 py-1 rounded-full flex items-center space-x-1.5">
            <span class="h-2 w-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span class="text-[10px] font-bold text-emerald-400">SECURE ENGINE</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md p-3.5 pb-24 space-y-4">

        <!-- Vault Balance Card -->
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 border border-amber-500/30 p-4 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[11px] uppercase tracking-wider text-amber-400 font-semibold">Active Vault Balance</span>
                <span class="bg-amber-500/10 text-amber-400 text-[10px] px-2 py-0.5 rounded-full font-mono">Status: Connected</span>
            </div>
            <div class="text-2xl font-extrabold text-white mb-3">
                ৳<span id="userBalance">15,000.00</span> <span class="text-xs font-normal text-slate-400">BDT</span>
            </div>
            <div class="flex space-x-2">
                <button onclick="depositFunds()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-2 rounded-xl text-xs font-bold transition-all shadow-md flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Deposit ৳5000</span>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Search native games..." class="w-full bg-[#0f172a] border border-slate-700 text-white rounded-full py-2.5 pl-12 pr-4 text-xs placeholder:text-slate-500 focus:border-amber-500 outline-none transition-all">
        </div>

        <!-- Games Grid -->
        <div id="gamesGrid" class="grid grid-cols-2 gap-3">
            <!-- Native Game Cards -->
        </div>

        <!-- Native Game Player Modal (No External Website UI) -->
        <div id="gameModal" class="hidden fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-center p-3">
            <div class="w-full max-w-md bg-slate-900 border border-amber-500/50 rounded-3xl overflow-hidden shadow-2xl flex flex-col h-[80vh]">
                <div class="bg-slate-950 p-3.5 border-b border-slate-800 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <h3 id="modalTitle" class="text-xs font-bold text-white uppercase tracking-wider">Native Game Session</h3>
                    </div>
                    <button onclick="closeGameModal()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1 rounded-lg text-xs font-bold transition-all">
                        <i class="fa-solid fa-xmark"></i> Exit Game
                    </button>
                </div>
                <!-- Native Game Canvas / Viewport -->
                <div id="nativeGameViewport" class="flex-1 bg-slate-950 w-full relative flex flex-col items-center justify-center p-4">
                    <!-- Dynamic Interactive Game Screen -->
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="w-full max-w-md bg-[#0f172a]/95 backdrop-blur-lg border-t border-slate-800 fixed bottom-0 z-50 flex justify-around items-center py-2 px-1">
        <a href="#" class="flex flex-col items-center text-amber-500 space-y-0.5">
            <i class="fa-solid fa-fire text-sm"></i>
            <span class="text-[9px] font-semibold">Lobby</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-white space-y-0.5">
            <i class="fa-solid fa-wallet text-sm"></i>
            <span class="text-[9px] font-medium">Vault</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-white space-y-0.5">
            <i class="fa-solid fa-user text-sm"></i>
            <span class="text-[9px] font-medium">Profile</span>
        </a>
    </nav>

    <!-- Native Script Engine -->
    <script>
        let balance = 15000.00;

        const nativeGames = [
            { id: 1, name: "Highway Turbo", category: "action", stake: 100, icon: "car-side", type: "racer" },
            { id: 2, name: "Neon Puzzle", category: "puzzle", stake: 80, icon: "puzzle-piece", type: "puzzle" },
            { id: 3, name: "Cyber Arcade", category: "arcade", stake: 150, icon: "gamepad", type: "arcade" },
            { id: 4, name: "Stunt Rider", category: "action", stake: 120, icon: "motorcycle", type: "racer" },
            { id: 5, name: "Basket Star", category: "arcade", stake: 90, icon: "basketball", type: "arcade" },
            { id: 6, name: "Quantum Chess", category: "puzzle", stake: 50, icon: "chess", type: "puzzle" }
        ];

        function updateBalance() {
            document.getElementById('userBalance').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2});
        }

        function renderGames(gamesArray) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            gamesArray.forEach(game => {
                const card = document.createElement('div');
                card.className = "game-card bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 rounded-2xl p-3 flex flex-col justify-between cursor-pointer transition-all shadow-md group";
                card.onclick = () => launchNativeGame(game);

                card.innerHTML = `
                    <div class="h-24 rounded-xl bg-gradient-to-br from-amber-600/20 to-slate-900 flex flex-col items-center justify-center text-amber-400 relative overflow-hidden">
                        <i class="fa-solid fa-${game.icon} text-3xl group-hover:scale-110 transition-transform"></i>
                        <span class="text-[9px] font-mono mt-1 text-slate-400 uppercase">${game.category}</span>
                    </div>
                    <div class="mt-2">
                        <h4 class="text-xs font-bold text-white flex justify-between">
                            <span>${game.name}</span>
                            <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1 rounded">Native</span>
                        </h4>
                        <p class="text-[10px] text-amber-400 mt-0.5">Stake: ৳${game.stake} (Instant)</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = () => {
            renderGames(nativeGames);
        };

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = nativeGames.filter(g => g.name.toLowerCase().includes(term) || g.category.toLowerCase().includes(term));
            renderGames(filtered);
        });

        function launchNativeGame(game) {
            if(balance < game.stake) {
                alert("আপনার ভল্টে পর্যাপ্ত ব্যালেন্স নেই! দয়া করে ডিপোজিট করুন।");
                return;
            }

            balance -= game.stake;
            updateBalance();

            document.getElementById('modalTitle').innerText = `${game.name} (Stake: ৳${game.stake} Paid)`;
            
            let viewport = document.getElementById('nativeGameViewport');
            viewport.innerHTML = `
                <div class="text-center space-y-4 w-full">
                    <div class="bg-slate-900 border border-amber-500/40 p-6 rounded-2xl shadow-inner flex flex-col items-center space-y-3">
                        <i class="fa-solid fa-${game.icon} text-5xl text-amber-400 animate-bounce"></i>
                        <h4 class="text-sm font-bold text-white">${game.name} Engine Active</h4>
                        <p class="text-[11px] text-slate-400">আপনার নিজস্ব অ্যাপের ভেতরে গেমটি সফলভাবে রান হচ্ছে।</p>
                        <div id="gameScoreBox" class="text-xl font-mono font-black text-amber-400">Score: 0</div>
                        <button onclick="playNativeAction()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition-all shadow">PLAY / SCORE POINTS</button>
                    </div>
                </div>
            `;
            document.getElementById('gameModal').classList.remove('hidden');
        }

        let currentScore = 0;
        function playNativeAction() {
            currentScore += Math.floor(Math.random() * 50) + 10;
            let sb = document.getElementById('gameScoreBox');
            if(sb) sb.innerText = `Score: ${currentScore}`;
        }

        function closeGameModal() {
            currentScore = 0;
            document.getElementById('gameModal').classList.add('hidden');
        }

        function depositFunds() {
            balance += 5000;
            updateBalance();
            alert("সফলভাবে ৳৫,০০০ ডিপোজিট করা হয়েছে!");
        }
    </script>
</body>
</html>
