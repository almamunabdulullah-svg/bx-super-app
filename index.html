                </div>
                <button class="action-btn btn-gold" onclick="showToast('AI Code Generated & Integrated Automatically!')">Generate & Deploy App</button>
                <div style="margin-top: 10px; font-size: 10px; color: #FCD535; text-align: center;">
                    🛡️ Anti-Delete Protection Shield Locked (App Cannot Be Deleted)
                </div>
            `;
        }

        function renderProfile() {
            return `
                <button class="back-btn" onclick="switchTab('home')">← Back to Home</button>
                <h3 style="color: #FCD535; margin-bottom: 10px;">👤 Select Avatar & KYC</h3>
                <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:8px; margin-bottom:14px;">
                    <div onclick="selectedAvatar='🐱'; localStorage.setItem('bx_avatar','🐱'); showToast('Avatar Updated'); switchTab('home');" class="feature-box" style="font-size:22px;">🐱</div>
                    <div onclick="selectedAvatar='🐼'; localStorage.setItem('bx_avatar','🐼'); showToast('Avatar Updated'); switchTab('home');" class="feature-box" style="font-size:22px;">🐼</div>
                    <div onclick="selectedAvatar='🦊'; localStorage.setItem('bx_avatar','🦊'); showToast('Avatar Updated'); switchTab('home');" class="feature-box" style="font-size:22px;">🦊</div>
                    <div onclick="selectedAvatar='🦁'; localStorage.setItem('bx_avatar','🦁'); showToast('Avatar Updated'); switchTab('home');" class="feature-box" style="font-size:22px;">🦁</div>
                    <div onclick="selectedAvatar='🤖'; localStorage.setItem('bx_avatar','🤖'); showToast('Avatar Updated'); switchTab('home');" class="feature-box" style="font-size:22px;">🤖</div>
                </div>
                <div class="detail-card"><b>User ID:</b> ${uniqueId}<br><b>Name:</b> ${userName}<br><b>KYC Status:</b> <span style="color:#0ECB81;">Verified</span></div>
            `;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            const content = document.getElementById('pageContent');
            const map = { 'home': 0, 'markets': 1, 'trade': 2, 'wallet': 3, 'profile': 4 };
            if(map[tabName] !== undefined) document.querySelectorAll('.nav-btn')[map[tabName]].classList.add('active');

            if (tabName === 'home') content.innerHTML = renderHome();
            else if (tabName === 'markets') content.innerHTML = renderMarkets();
            else if (tabName === 'trade') {
                content.innerHTML = renderTrade();
                setTimeout(() => {
                    const container = document.getElementById('chartContainer');
                    if (container) {
                        container.innerHTML = "";
                        let chart = LightweightCharts.createChart(container, {
                            width: container.clientWidth,
                            height: 210,
                            layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#848E9C' }
                        });
                        let candleSeries = chart.addCandlestickSeries({ upColor: '#0ECB81', downColor: '#F6465D' });
                        candleSeries.setData([
                            { time: '2026-08-01', open: 62000, high: 65400, low: 61500, close: 64200 },
                            { time: '2026-08-05', open: 64200, high: 66800, low: 63800, close: 65900 },
                            { time: '2026-08-10', open: 65900, high: 67500, low: 65000, close: 67100 }
                        ]);
                    }
                }, 100);
            }
            else if (tabName === 'wallet') content.innerHTML = renderWallet();
            else if (tabName === 'deposit') content.innerHTML = renderDeposit();
            else if (tabName === 'withdraw') content.innerHTML = renderWithdraw();
            else if (tabName === 'p2p') content.innerHTML = renderP2P();
            else if (tabName === 'casino') content.innerHTML = renderCasino();
            else if (tabName === 'meme') content.innerHTML = renderMeme();
            else if (tabName === 'devHub') content.innerHTML = renderDevHub();
            else if (tabName === 'adminVault') content.innerHTML = renderAdminVault();
            else if (tabName === 'profile') content.innerHTML = renderProfile();
        }
    </script>
</body>
</html>
