<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Real-Time Super Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- ফন্ট অসাম আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- নেভিগেশন বার -->
    <nav class="navbar">
        <div class="logo">BX Dashboard</div>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Live Feed</a></li>
            <li><a href="#">Account</a></li>
        </ul>
        <button id="connectWalletBtn" class="connect-btn">
            <i class="fas fa-wallet"></i> Connect Wallet
        </button>
    </nav>

    <!-- মূল কন্টেন্ট এলাকা -->
    <main class="container">
        
        <!-- ওয়ালেট স্ট্যাটাস কার্ড -->
        <div class="card wallet-card">
            <div class="card-header">
                <h3><i class="fas fa-info-circle"></i> Wallet Overview</h3>
                <span id="walletStatus" class="status-tag disconnected">Disconnected</span>
            </div>
            <div class="card-body">
                <p class="wallet-address" id="walletAddressDisplay">0x30Ad...CF6A</p>
                <div class="balance-section">
                    <span>Balance:</span>
                    <span class="balance-amount" id="walletBalance">0.00 ETH</span>
                </div>
            </div>
        </div>

        <!-- লাইভ স্ট্রিম সেকশন -->
        <div class="live-section">
            <h2><i class="fas fa-bolt"></i> Real-Time Data Stream</h2>
            
            <!-- লাইভ ডেটা কার্ড (ওয়েবসোকেট থেকে আসবে) -->
            <div id="liveFeedContainer">
                <div class="card live-card">
                    <div class="live-icon"><i class="fas fa-sync-alt fa-spin"></i></div>
                    <div class="live-content">
                        <h4>Waiting for connection...</h4>
                        <p>Live packets will appear here once connected.</p>
                    </div>
                    <span class="live-tag">LIVE</span>
                </div>
            </div>
        </div>

    </main>

    <!-- ফুটার -->
    <footer>
        <p>© 2023 BX Super App Technologies. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
