<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Master Casino Aggregator Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #060913;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #00ffcc;
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        p {
            color: #8899ac;
            font-size: 14px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .game-card {
            background: #0f172a;
            border: 2px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .game-card:hover {
            border-color: #00ffcc;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 255, 204, 0.2);
        }
        .game-card h3 {
            color: #ff007f;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .game-card p {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .game-card a {
            display: inline-block;
            padding: 10px 20px;
            background: #00ffcc;
            color: #060913;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.2s;
        }
        .game-card a:hover {
            background: #00b388;
        }
    </style>
</head>
<body>

    <header>
        <h1>BX CASINO AGGREGATOR</h1>
        <p>Universal Master API Connected Platform // 24/7 Autonomous Hub</p>
    </header>

    <div class="games-grid" id="lobby-container">
        <!-- Dynamic Games Loaded Automatically -->
    </div>

    <script>
        // আপনার গেমগুলোর লিস্ট। নতুন গেম বানালে শুধু এখানে একটি করে লাইন বাড়িয়ে দেবেন।
        const registeredGames = [
            { id: 'game1', title: 'BX Crash Pro (Game 1)', file: 'game1.html', desc: 'Universal master engine connected crash simulation.' },
            { id: 'space', title: 'BX Space Flight', file: 'space.html', desc: 'High altitude planetary rocket ascension.' },
            { id: 'crashx', title: 'BX Crash Xtreme', file: 'crashx.html', desc: 'Neon themed high-speed multiplier protocol.' }
        ];

        function renderLobby() {
            const container = document.getElementById('lobby-container');
            container.innerHTML = '';

            registeredGames.forEach(game => {
                container.innerHTML += `
                    <div class="game-card">
                        <h3>${game.title}</h3>
                        <p>${game.desc}</p>
                        <a href="${game.file}">PLAY NOW</a>
                    </div>
                `;
            });
        }

        renderLobby();
    </script>
</body>
</html>
