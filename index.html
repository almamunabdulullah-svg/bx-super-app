<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Master Casino Platform - Auto Registry Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #080c14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #00ffcc;
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        p {
            color: #8899ac;
            font-size: 14px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 950px;
        }
        .game-card {
            background: #111a2e;
            border: 2px solid #1e2942;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .game-card:hover {
            border-color: #00ffcc;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 255, 204, 0.2);
        }
        .game-card h3 {
            color: #ff007f;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .game-card p {
            color: #a0aec0;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .game-card a {
            display: inline-block;
            padding: 10px 20px;
            background: #00ffcc;
            color: #080c14;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.2s;
        }
        .game-card a:hover {
            background: #00b388;
        }
    </style>
</head>
<body>

    <header>
        <h1>BX CASINO PLATFORM</h1>
        <p>Auto-Registry Engine // Unified Master Architecture</p>
    </header>

    <div class="games-grid" id="auto-game-container">
        <!-- Dynamically loaded games will appear here automatically -->
    </div>

    <script>
        // Central Registry of all platform games connected to Master Engine
        const registeredGames = [
            { id: 'space', title: 'BX Space Crash', file: 'space.html', desc: 'Classic crash flight multiplier with autonomous 24/7 rounds.' },
            { id: 'cyber', title: 'BX Cyberpunk Crash', file: 'cyber.html', desc: 'Neon grid protocol featuring high-speed hover-bike action.' },
            { id: 'ocean', title: 'BX Deep Sea Crash', file: 'ocean.html', desc: 'Abyssal trench submarine descent with high-pressure multipliers.' },
            { id: 'turbo', title: 'BX Turbo Crash', file: 'turbo.html', desc: 'High-altitude military jet afterburner flight simulation.' }
        ];

        function renderLobby() {
            const container = document.getElementById('auto-game-container');
            container.innerHTML = '';

            registeredGames.forEach(game => {
                container.innerHTML += `
                    <div class="game-card">
                        <h3>${game.title}</h3>
                        <p>${game.desc}</p>
                        <a href="${game.file}">PLAY NOW</a>
                    </div>
                `;
            });
        }

        renderLobby();
    </script>
</body>
</html>
