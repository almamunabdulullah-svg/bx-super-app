<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super-App Master</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0B0E14; color: #FFFFFF; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background-color: #0B0E14; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .content { padding: 16px; overflow-y: auto; flex-grow: 1; padding-bottom: 90px; }
        
        /* Layout & Cards */
        .top-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .card { background-color: #181D28; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 12px; flex: 1; }
        .profile-box { display: flex; align-items: center; gap: 10px; cursor: pointer; height: 100%; }
        .avatar { width: 44px; height: 44px; background-color: #00E5FF; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold; }
        
        .usd-text { font-size: 18px; font-weight: bold; color: #00E5FF; }
        .bdt-text { font-size: 12px; color: grey; margin-top: 2px; }
        
        .mini-btns { display: flex; gap: 6px; margin-top: 8px; }
        .mini-btn { background-color: rgba(0, 229, 255, 0.2); color: #00E5FF; border: none; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }

        /* Ticker */
        .ticker { background-color: #181D28; border-radius: 10px; padding: 10px 12px; font-size: 11px; color: #FFB300; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.05); }
        
        /* Section & Grids */
        .section-title { font-size: 15px; font-weight: bold; color: rgba(255, 255, 255, 0.8); margin-bottom: 10px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .feature-box { background-color: #181D28; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 12px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .feature-box:hover { border-color: #00E5FF; }
        .feature-box span { font-size: 11px; color: rgba(255, 255, 255, 0.7); margin-top: 6px; }

        /* Auto Injected Games List */
        .game-item { background-color: #181D28; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .status-badge { background-color: rgba(14, 203, 129, 0.2); color: #0ECB81; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background-color: #12161F; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .nav-btn { background: none; border: none; color: grey; font-size: 11px; display: flex; flex-direction: column; align-items: center; cursor: pointer; gap: 4px; }
        .nav-btn.active { color: #00E5FF; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #181D28; padding: 20px; border-radius: 16px; width: 85%; max-width: 320px; border: 1px solid rgba(255,255,255,0.2); text-align: center; }
        .modal-content input { width: 100%; padding: 10px; margin: 15px 0; background: #0B0E14; border: 1px solid #444; color: #fff; border-radius: 8px; outline: none; }
        .modal-content button { background: #00E5FF; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="content" id="pageContent">
        <!-- Main UI Rendered via Script -->
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab(0)"><span>🏠</span>Home</button>
        <button class="nav-btn" onclick="switchTab(1)"><span>📊</span>Market</button>
        <button class="nav-btn" onclick="switchTab(2)"><span>🎮</span>BX Play</button>
        <button class="nav-btn" onclick="switchTab(3)"><span>📼</span>Social</button>
        <button class="nav-btn" onclick="switchTab(4)"><span>💼</span>Wallet</button>
    </div>
</div>

<!-- Secret Master Modal -->
<div class="modal" id="secretModal">
    <div class="modal-content">
        <h3 style="color: #FFD700; margin-bottom: 8px;">🔒 Master Backend Access</h3>
        <p style="font-size: 11px; color: grey;">Contract: 0x30Ad...6A</p>
        <input type="password" id="masterKey" placeholder="Enter Secret Code">
        <br>
        <button onclick="verifyKey()">Authorize</button>
        <button style="background:transparent; color:grey; margin-top:8px;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    let usd = 150.00;
    let bdt = 18000.00;
    let tapCount = 0;

    // Auto-injected dynamic items/games list (নতুন গেম বা ফিচার বসালে এখানে অটো যুক্ত হবে)
    let dynamicGames = [
        {name: "🎰 BX Crash Arena", status: "Live Payout"},
        {name: "🎲 Crypto Spin Pro", status: "Active"},
        {name: "🚀 Mainnet Dice", status: "Verified"}
    ];

    function renderHome() {
        return `
            <div class="top-row">
                <div class="card">
                    <div class="profile-box" onclick="triggerGodMode()">
                        <div class="avatar">🛡️</div>
                        <div>
                            <div style="font-weight: bold; font-size: 13px;">BX Secure Node</div>
                            <div style="color: #0ECB81; font-size: 10px;">ID: #8420MN (Live)</div>
                        </div>
                    </div>
                </div>
                <div class="card" style="border-color: rgba(0, 229, 255, 0.3);">
                    <div class="usd-text">$${usd.toFixed(2)} USD</div>
                    <div class="bdt-text">৳${bdt.toFixed(2)} BDT</div>
                    <div class="mini-btns">
                        <button class="mini-btn" onclick="handleTransaction('P2P')">P2P</button>
                        <button class="mini-btn" onclick="handleTransaction('Web3')">Wallet</button>
                    </div>
                </div>
            </div>

            <div class="ticker">
                <span>🔥</span>
                <span>Live Mainnet: Smart Contract 0x30Ad27...6A Synchronized.</span>
            </div>

            <div class="section-title">Super-App Hub (17 Live Modules)</div>
            <div class="grid-4">
                <div class="feature-box" onclick="showAlert('Swap Module')"><span>🔄</span><span>Swap</span></div>
                <div class="feature-box" onclick="switchTab(2)"><span>🎮</span><span>BX Play</span></div>
                <div class="feature-box" onclick="switchTab(3)"><span>📺</span><span>SocialFi</span></div>
                <div class="feature-box" onclick="showAlert('Banking Module')"><span>🏦</span><span>Banking</span></div>
                <div class="feature-box" onclick="triggerGodMode()"><span>🛡️</span><span>Vault</span></div>
                <div class="feature-box" onclick="showAlert('Staking Active')"><span>📈</span><span>Staking</span></div>
                <div class="feature-box" onclick="showAlert('NFT Market')"><span>🎁</span><span>NFT</span></div>
                <div class="feature-box" onclick="showAlert('AI Manager')"><span>⚡</span><span>AI Bot</span></div>
            </div>

            <div class="section-title">Auto-Injected Game Arena</div>
            <div id="gameListContainer">
                ${dynamicGames.map(g => `
                    <div class="game-item">
                        <span style="font-size: 13px; font-weight: bold;">${g.name}</span>
                        <span class="status-badge">${g.status}</span>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function switchTab(index) {
        const buttons = document.querySelectorAll('.nav-btn');
        buttons.forEach((btn, idx) => {
            if (idx === index) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        const content = document.getElementById('pageContent');
        if (index === 0) {
            content.innerHTML = renderHome();
        } else if (index === 1) {
            content.innerHTML = `<div style="text-align:center; padding-top:60px;"><h3 style="color:#00E5FF;">Market & Multi-Currency Engine</h3><p style="color:grey; margin-top:10px; font-size:13px;">Real-time liquidity routed to mainnet address.</p></div>`;
        } else if (index === 2) {
            content.innerHTML = `<div style="text-align:center; padding-top:60px;"><h3 style="color:#00E5FF;">BX Play & Casino Hub</h3><p style="color:grey; margin-top:10px; font-size:13px;">All auto-injected games are fully operational here.</p></div>`;
        } else if (index === 3) {
            content.innerHTML = `<div style="text-align:center; padding-top:60px;"><h3 style="color:#00E5FF;">SocialFi Video & Reward Hub</h3><p style="color:grey; margin-top:10px; font-size:13px;">Community creators and payout streams.</p></div>`;
        } else if (index === 4) {
            content.innerHTML = `<div style="text-align:center; padding-top:60px;"><h3 style="color:#00E5FF;">Trust Wallet & Vault Gateway</h3><p style="color:grey; margin-top:10px; font-size:13px;">Connected with Contract: 0x30Ad27...6A</p></div>`;
        }
    }

    function handleTransaction(type) {
        usd += 50.00;
        bdt += 5800.00;
        alert(`🔗 ${type} Transaction Successful! Real assets routed to your node.`);
        if(document.querySelector('.nav-btn.active').innerText.includes('Home')) {
            document.getElementById('pageContent').innerHTML = renderHome();
        }
    }

    function showAlert(moduleName) {
        alert(`🚀 ${moduleName} is fully connected to the mainnet.`);
    }

    function triggerGodMode() {
        tapCount++;
        if (tapCount >= 4) {
            tapCount = 0;
            document.getElementById('secretModal').style.display = 'flex';
        }
        setTimeout(() => { tapCount = 0; }, 2000);
    }

    function closeModal() {
        document.getElementById('secretModal').style.display = 'none';
    }

    function verifyKey() {
        const val = document.getElementById('masterKey').value;
        if (val === "420MM420") {
            alert("✅ Master Backend & All Hidden Features Unlocked!");
            closeModal();
        } else {
            alert("❌ Invalid Access Key");
        }
    }

    // Initial Load
    document.getElementById('pageContent').innerHTML = renderHome();
</script>

</body>
</html>
