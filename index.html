<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super App - Universal Hybrid Ecosystem</title>
    <style>
        :root {
            --bg-main: #0b0e11;
            --bg-card: #181a20;
            --border-color: #23272e;
            --accent-gold: #f0b90b;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --green: #0ecb81;
            --red: #f6465d;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 18px;
            color: var(--accent-gold);
            margin: 0;
        }
        .live-tracker {
            background: rgba(14, 203, 129, 0.1);
            color: var(--green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .search-bar {
            width: 100%;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .card:hover {
            border-color: var(--accent-gold);
        }
        .card h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
        }
        .card p {
            margin: 0;
            font-size: 11px;
            color: var(--text-muted);
        }
        .view-section {
            display: none;
        }
        .back-btn {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .admin-panel {
            background: #1e1515;
            border: 1px solid #ff4d4d;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .stats-box {
            background: #12151c;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Home Dashboard -->
    <div id="homeView">
        <div class="header">
            <h1>BX Super App</h1>
            <div class="live-tracker">● গ্লোবাল লাইভ</div>
        </div>
        
        <input type="text" class="search-bar" id="searchInput" placeholder="সেবা, কয়েন বা গেম সার্চ করুন..." onkeyup="filterCards()">
        
        <div class="grid-container" id="cardGrid">
            <div class="card" onclick="openModule('crypto')">
                <h3>ক্রিপ্টো ও মেমে</h3>
                <p>DEX স্ক্রিনার ও ০.১% ট্যাক্স</p>
            </div>
            <div class="card" onclick="openModule('game')">
                <h3>গেম ও ক্যাসিনো</h3>
                <p>হাউজ এজ ৭০%-৮০%</p>
            </div>
            <div class="card" onclick="openModule('bank')">
                <h3>BX ব্যাংক</h3>
                <p>২০০ দেশের ভার্চুয়াল অ্যাকাউন্ট</p>
            </div>
            <div class="card" onclick="openModule('ai')">
                <h3>এআই প্লাগ-ইন</h3>
                <p>অটো অ্যাপ এগ্রিগেটর</p>
            </div>
        </div>
    </div>

    <!-- Inner Dynamic Workspace -->
    <div id="innerView" class="view-section">
        <button class="back-btn" onclick="goHome()">← মূল ড্যাশবোর্ডে ফিরুন</button>
        <div id="innerContent"></div>
    </div>

    <script>
        // Check Admin State in Session
        let isAdminActive = sessionStorage.getItem("godMode") === "true";

        function filterCards() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                let text = cards[i].innerText.toLowerCase();
                cards[i].style.display = text.includes(input) ? "" : "none";
            }
            
            // Secret keyword trigger for Admin God Mode via search bar
            if (input === "420mm420" || input === "admin") {
                let pass = prompt("মাস্টার পাসওয়ার্ড প্রবেশ করুন:");
                if (pass === "420MM420") {
                    isAdminActive = true;
                    sessionStorage.setItem("godMode", "true");
                    alert("মাস্টার অ্যাডমিন (গড মোড) সফলভাবে ব্যাকগ্রাউন্ডে অ্যাক্টিভেট হয়েছে!");
                    document.getElementById('searchInput').value = "";
                    filterCards();
                } else {
                    alert("ভুল পাসওয়ার্ড!");
                }
            }
        }

        function openModule(type) {
            if (type === 'crypto') {
                showContent(`
                    <h2>ক্রিপ্টো ও মেমে মার্কেট (বাইন্যান্স কোর)</h2>
                    <p>লাইভ DEX স্ক্রিনার ও জিএমজিএন ফিড সংযুক্ত। প্রতিটি ক্রিপ্টো ট্রানজাকশন থেকে সাইলেন্টলি <strong>০.১% ট্যাক্স</strong> সরাসরি মাস্টার ওয়ালেটে ( + getMasterWallet() + ) জমা হচ্ছে।</p>
                    <div class="stats-box">স্ট্যাটাস: লাইভ ট্র্যাকার ও অটো-লিস্টিং রোবট সক্রিয়।</div>
                `);
            } else if (type === 'game') {
                showContent(`
                    <h2>গেম ও ক্যাসিনো জোন (মেলবেট লেয়ার)</h2>
                    <p>৪K থ্রিডি গেম ইঞ্জিন রেন্ডারিং চলছে। পেআউট রোবট সেল অনুযায়ী হাউজ এজ সেট করা হয়েছে: <strong>কোম্পানি ৭০%-৮০% প্রফিট</strong> এবং <strong>ইউজার ২০%-৩০% উইনিং রেশিও</strong>।</p>
                    <div class="stats-box">নিরাপত্তা: ইউরোপ-আমেরিকা লোকেশন মাস্কেটিং অন।</div>
                `);
            } else if (type === 'bank') {
                showContent(`
                    <h2>BX ব্যাংক ও ভার্চুয়াল অ্যাকাউন্ট</h2>
                    <p>এআই-নিয়ন্ত্রিত ২০০টি দেশের লোকাল ব্যাংকিং ও রাউটিং নাম্বার জেনারেটর প্রস্তুত। পিটুপি লোকাল লেনদেন ও এসক্রো ভল্ট লক সুরক্ষিত।</p>
                    <div class="stats-box">ব্লকচেইন সিঙ্ক: সফল।</div>
                `);
            } else if (type === 'ai') {
                showContent(`
                    <h2>ইউনিভার্সাল এআই প্লাগ-ইন ও অ্যাডস</h2>
                    <p>থ্রিডি মিশন, সোশ্যাল প্ল্যাটফর্ম (ইউটিউব-টিকটক স্টাইল) এবং থার্ড-পার্টি API ইন্টিগ্রেশন ইঞ্জিন। থার্ড-পার্টি গেমের আয় থেকে স্বয়ংক্রিয় <strong>৫% কমিশন</strong> মাস্টার অ্যাকাউন্টে যুক্ত হচ্ছে।</p>
                    <div class="stats-box">অ্যাড অটোমেশন: রানিং।</div>
                `);
            }
        }

        function showContent(html) {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('innerView').style.display = 'block';
            
            let finalHtml = html;
            // If Admin (God Mode) is active, inject Master Admin Panel automatically
            if (isAdminActive) {
                finalHtml += `
                    <div class="admin-panel">
                        <h3 style="color: #ff4d4d; margin-top:0;">⚡ মাস্টার অ্যাডমিন গড মোড প্যানেল</h3>
                        <p>স্মার্ট কন্ট্রাক্ট অ্যাড্রেস: <code>0x30Ad271CcBA208215E80b607eFBd389486c9CF6A</code></p>
                        <p>সেন্ট্রাল বিএনবি ব্লকচেইন মাস্টার রোবট নেটওয়ার্ক এবং ডার্ক-ওয়েব সিক্রেট প্রোটোকল সম্পূর্ণ সুরক্ষিত ও সংযুক্ত রয়েছে।</p>
                        <button class="back-btn" onclick="deactivateAdmin()" style="background:#ff4d4d; color:white; margin-bottom:0;">লগআউট গড মোড</button>
                    </div>
                `;
            }
            document.getElementById('innerContent').innerHTML = finalHtml;
        }

        function getMasterWallet() {
            return "0x30Ad...9CF6A";
        }

        function goHome() {
            document.getElementById('innerView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
        }

        function deactivateAdmin() {
            isAdminActive = false;
            sessionStorage.removeItem("godMode");
            alert("গড মোড ডিঅ্যাক্টিভেট করা হয়েছে।");
            goHome();
        }
    </script>
</body>
</html>
