<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BX Super-App - Global 21-Feature System</title>
  <style>
    :root {
      --bg: #070913;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00e5ff;
      --text: #ffffff;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(145deg, #0e1422, #04060b);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand {
      font-size: 15px;
      font-weight: bold;
      color: var(--accent);
    }
    .balance-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
    }
    .ticker {
      background: rgba(0, 229, 255, 0.05);
      border-left: 3px solid var(--accent);
      padding: 5px 8px;
      font-size: 10px;
      color: var(--accent);
      margin-bottom: 12px;
      border-radius: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
      color: var(--text);
      font-size: 10px;
      cursor: pointer;
    }
    .btn:hover {
      border-color: var(--accent);
    }
    .view {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      min-height: 75px;
    }
    .god-mode {
      margin-top: 10px;
      background: rgba(255, 0, 0, 0.05);
      border: 1px dashed rgba(255, 0, 0, 0.3);
      padding: 8px;
      border-radius: 8px;
      text-align: center;
      font-size: 11px;
      cursor: pointer;
      color: #ff4d4d;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">BX Super-App (21 Systems)</div>
      <div style="font-size: 10px; color: var(--muted);">AI Active</div>
    </div>
    <div class="balance-box">
      <div style="font-size: 10px; color: var(--muted);">Global Portfolio</div>
      <div style="font-size: 20px; font-weight: bold; color: var(--accent);">$15,005.68 USD</div>
    </div>
    <div class="ticker">
      🔴 লাইভ টিক্কার: গ্যাসলেস ট্রানজেকশন ও এসক্রো প্রটেকশন active।
    </div>
    <div class="grid">
      <div class="btn" onclick="openTab('Home', 'হোম ড্যাশবোর্ড active.')">🏠<br>Home</div>
      <div class="btn" onclick="openTab('Market', 'ক্রস-চেইন সোয়াপ active.')">📈<br>Market</div>
      <div class="btn" onclick="openTab('Gaming', '৭০% হাউস এজ active.')">🎮<br>Gaming</div>
      <div class="btn" onclick="openTab('Wallet', 'এসক্রো ও গেটওয়ে active.')">👝<br>Wallet</div>
      <div class="btn" onclick="openTab('Profile', 'কেওয়াইসি active.')">👤<br>Profile</div>
      <div class="btn" onclick="openTab('Launchpad', 'এনএফটি ও মিনি-অ্যাপ active.')">🚀<br>Launchpad</div>
      <div class="btn" onclick="openTab('Fitness', 'ফিটনেস-টু-আর্ন active.')">⚡<br>Fitness</div>
      <div class="btn" onclick="openTab('Spin', 'ডেইলি লাকি স্পিন active.')">🎯<br>Spin</div>
    </div>
    <div class="view" id="screenView">
      <h4 style="margin: 0 0 4px 0; color: var(--accent);">সিস্টেম প্রস্তুত</h4>
      <p style="font-size: 11px; color: var(--muted); margin: 0;">যেকোনো ফিচারে ক্লিক করুন।</p>
    </div>
    <div class="god-mode" onclick="activateGodMode()">
      🔐 গড মোড অ্যাডমিন প্যানেল (কোড: 420MN420)
    </div>
  </div>
  <script>
    function openTab(title, desc) {
      document.getElementById('screenView').innerHTML = `<h4 style="margin: 0 0 4px 0; color: var(--accent);">${title}</h4><p style="font-size: 11px; color: var(--muted); margin: 0;">${desc}</p>`;
    }
    function activateGodMode() {
      let code = prompt("মালিকের সিক্রেট কোড দিন (420MN420):");
      if (code === "420MN420") {
        alert("স্বাগতম বস! গড মোড অ্যাডমিন প্যানেল active।");
      } else if (code !== null) {
        alert("ভুল সিক্রেট কোড!");
      }
    }
  </script>
</body>
</html>
