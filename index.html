<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Crash Game</title>
    <style>
        body { background-color: #0F172A; color: #F8FAFC; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .game-box { max-width: 600px; margin: 0 auto; background: #1E293B; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .screen { height: 250px; background: #090D16; border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #multiplier { font-size: 3rem; font-weight: bold; color: #38BDF8; }
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        input { padding: 10px; width: 100px; background: #0F172A; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 1rem; }
        button { padding: 10px 20px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        #betBtn { background: #22C55E; color: white; }
        #cashoutBtn { background: #EF4444; color: white; display: none; }
        .crashed { color: #EF4444 !important; }
    </style>
</head>
<body>

    <div class="game-box">
        <h2>BX Crash Game Engine</h2>
        <div class="screen">
            <div id="multiplier">1.00x</div>
        </div>
        <div class="controls">
            <input type="number" id="betAmount" value="100" placeholder="Bet">
            <button id="betBtn" onclick="startTheGame()">Place Bet</button>
            <button id="cashoutBtn" onclick="cashOut()">Cash Out</button>
        </div>
        <p>Balance: <span id="userBalance">1000</span> BDT</p>
    </div>

    <script>
        let balance = 1000;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let isPlaying = false;
        let crashAt = 1.00;

        function startTheGame() {
            let bet = parseFloat(document.getElementById('betAmount').value);
            if(bet > balance || bet <= 0) {
                alert('পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }
            
            balance -= bet;
            document.getElementById('userBalance').innerText = balance;
            
            document.getElementById('betBtn').style.display = 'none';
            document.getElementById('cashoutBtn').style.display = 'inline-block';
            
            currentMultiplier = 1.00;
            isPlaying = true;
            document.getElementById('multiplier').classList.remove('crashed');
            
            // রেন্ডম ক্র্যাশ পয়েন্ট তৈরি (যেমন ১.১০x থেকে ৫.০০x এর মধ্যে ক্র্যাশ করবে)
            crashAt = (Math.random() * 4 + 1.1).toFixed(2);

            gameInterval = setInterval(() => {
                currentMultiplier += 0.04;
                document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + 'x';

                if(currentMultiplier >= crashAt) {
                    gameOver(false);
                }
            }, 100);
        }

        function cashOut() {
            if(!isPlaying) return;
            let bet = parseFloat(document.getElementById('betAmount').value);
            let winAmount = (bet * currentMultiplier).toFixed(0);
            balance += parseInt(winAmount);
            document.getElementById('userBalance').innerText = balance;
            alert('অভিনন্দন! আপনি জিতেছেন: ' + winAmount + ' BDT');
            gameOver(true);
        }

        function gameOver(isWon) {
            clearInterval(gameInterval);
            isPlaying = false;
            let mElem = document.getElementById('multiplier');
            
            if(!isWon) {
                mElem.innerText = "CRASHED (" + crashAt + "x)";
                mElem.classList.add('crashed');
            }

            document.getElementById('betBtn').style.display = 'inline-block';
            document.getElementById('cashoutBtn').style.display = 'none';
        }
    </script>
</body>
</html>
