<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BX Mustafa Retro Arcade Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #050505;
        }
        #hud { 
            position: absolute;
            top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; 
            background: rgba(0, 0, 0, 0.9); 
            padding: 10px 20px; 
            font-size: 15px; 
            font-weight: bold; 
            z-index: 10;
            border-bottom: 3px solid #ff9800;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #controls { 
            position: absolute;
            bottom: 20px; left: 0; width: 100%;
            display: flex; justify-content: space-between; 
            align-items: center; padding: 0 30px; 
            z-index: 10;
            pointer-events: none;
        }
        .d-pad, .action-pad { display: flex; gap: 15px; pointer-events: auto; }
        .arcade-btn { 
            width: 70px; height: 70px; 
            background: rgba(255, 152, 0, 0.9); 
            border: 3px solid #fff; border-radius: 50%; 
            color: #fff; font-size: 12px; font-weight: bold; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 5px 0 #b76800;
            text-transform: uppercase;
        }
        .arcade-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b76800; }
        .shoot-btn { background: rgba(233, 30, 99, 0.95); box-shadow: 0 5px 0 #9c1341; width: 75px; height: 75px; }
        .jump-btn { background: rgba(76, 175, 80, 0.95); box-shadow: 0 5px 0 #2e7d32; width: 75px; height: 75px; }
        .special-btn { background: rgba(156, 39, 176, 0.95); box-shadow: 0 5px 0 #5e156b; width: 65px; height: 65px; }

        #modal { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.92); 
            justify-content: center; align-items: center; z-index: 100; 
        }
        .modal-content { 
            background: #1a1a1a; padding: 35px; 
            border: 4px solid #ff9800; border-radius: 12px; 
            text-align: center; max-width: 400px; 
        }
        .modal-btn { 
            padding: 12px 30px; font-size: 18px; 
            background: #e91e63; border: none; color: white; 
            cursor: pointer; font-weight: bold; border-radius: 6px; margin-top: 20px; 
            box-shadow: 0 4px 0 #9c1341;
        }
        .modal-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #9c1341; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div>Bet: <span id="bet-amount">100</span> BDT</div>
            <div>Lives: <span id="lives">❤️❤️❤️❤️❤️</span></div>
            <div>Stage: <span id="stage">1</span> (Multiplier: <span id="multiplier">1x</span>)</div>
        </div>
        <canvas id="gameCanvas"></canvas>

        <div id="controls">
            <div class="d-pad">
                <button class="arcade-btn" ontouchstart="movePlayer('left')" onmousedown="movePlayer('left')" ontouchend="stopPlayer()" onmouseup="stopPlayer()">LEFT</button>
                <button class="arcade-btn" ontouchstart="movePlayer('right')" onmousedown="movePlayer('right')" ontouchend="stopPlayer()" onmouseup="stopPlayer()">RIGHT</button>
            </div>
            <div class="action-pad">
                <button class="arcade-btn special-btn" onclick="specialPower()">SPECIAL</button>
                <button class="arcade-btn jump-btn" onclick="jumpPlayer()">JUMP</button>
                <button class="arcade-btn shoot-btn" onclick="shoot()">SHOOT</button>
            </div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2 style="color: #e91e63; margin-bottom: 15px;">GAME OVER!</h2>
            <p style="font-size: 15px; line-height: 1.5; margin-bottom: 10px;">Purchase 1 Live for 10 BDT to continue your mission and keep your active bet!</p>
            <button class="modal-btn" onclick="buyLife()">BUY 1 LIFE FOR 10 BDT</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let player = { x: 120, y: canvas.height - 230, width: 65, height: 110, vx: 0, speed: 7, isJumping: false };
    let enemy = { x: canvas.width - 280, y: canvas.height - 240, width: 90, height: 125, hp: 5 };
    let bullets = [];
    
    let balance = 1000;
    let bet = 100;
    let lives = 5;
    let currentStage = 1;
    let multiplier = 1;

    function updateHUD() {
        document.getElementById("bet-amount").innerText = bet;
        document.getElementById("lives").innerText = "❤️".repeat(lives > 0 ? lives : 0);
        document.getElementById("stage").innerText = currentStage;
        document.getElementById("multiplier").innerText = multiplier + "x";
    }

    function movePlayer(dir) {
        if (dir === 'left') player.vx = -player.speed;
        if (dir === 'right') player.vx = player.speed;
    }

    function stopPlayer() { player.vx = 0; }

    function jumpPlayer() {
        if (!player.isJumping) {
            player.isJumping = true;
            let jumpCount = 0;
            let jumpInterval = setInterval(() => {
                player.y -= 14;
                jumpCount++;
                if (jumpCount > 12) {
                    clearInterval(jumpInterval);
                    let fallInterval = setInterval(() => {
                        player.y += 14;
                        jumpCount--;
                        if (jumpCount <= 0) {
                            clearInterval(fallInterval);
                            player.isJumping = false;
                        }
                    }, 25);
                }
            }, 25);
        }
    }

    function shoot() {
        bullets.push({ x: player.x + player.width, y: player.y + 40, width: 18, height: 6, speed: 16 });
    }

    function specialPower() {
        enemy.hp -= 3;
        checkEnemyStatus();
    }

    function checkEnemyStatus() {
        if (enemy.hp <= 0) {
            if (currentStage < 5) {
                alert(`Congratulations! Stage ${currentStage} cleared. Multiplier is now ${currentStage + 1}x!`);
                currentStage++;
                multiplier = currentStage;
                enemy.hp = 5 + (currentStage * 3);
                enemy.x = canvas.width - 280;
            } else {
                let winAmount = bet * multiplier;
                balance += winAmount;
                alert(`🎉 Incredible! You defeated the final Dragon Boss and won ${winAmount} BDT!`);
                currentStage = 1;
                multiplier = 1;
                lives = 5;
                enemy.hp = 5;
            }
            updateHUD();
        }
    }

    function playerDies() {
        lives--;
        updateHUD();
        if (lives <= 0) {
            document.getElementById("modal").style.display = "flex";
        }
    }

    function buyLife() {
        if (balance >= 10) {
            balance -= 10;
            lives = 3;
            document.getElementById("modal").style.display = "none";
            updateHUD();
        } else {
            alert("Insufficient balance in wallet!");
        }
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Retro Arcade Background (City Buildings & Neon Signs)
        let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGrad.addColorStop(0, "#0b0218");
        bgGrad.addColorStop(0.6, "#1f0d3d");
        bgGrad.addColorStop(1, "#111");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Building 1 (BAR)
        ctx.fillStyle = "#16162b";
        ctx.fillRect(60, canvas.height - 400, 220, 300);
        ctx.fillStyle = "#ff3d00";
        ctx.font = "bold 22px Courier New";
        ctx.fillText("BAR", 140, canvas.height - 250);

        // Building 2 (HOTEL)
        ctx.fillStyle = "#220e30";
        ctx.fillRect(canvas.width - 340, canvas.height - 420, 240, 320);
        ctx.fillStyle = "#00e5ff";
        ctx.fillText("HOTEL", canvas.width - 250, canvas.height - 270);

        // Stage 5 Boss Background Theme
        if (currentStage === 5) {
            ctx.fillStyle = "rgba(106, 27, 154, 0.35)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff5722";
            ctx.font = "bold 24px Courier New";
            ctx.fillText("⚡ STAGE 5: PURPLE DRAGON BOSS ⚡", canvas.width / 2 - 240, 75);
        }

        // Roadway / Ground
        ctx.fillStyle = "#181818";
        ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        ctx.fillStyle = "#ff9800";
        ctx.fillRect(0, canvas.height - 105, canvas.width, 5);

        // Player physics update
        player.x += player.vx;
        if (player.x < 15) player.x = 15;
        if (player.x > canvas.width - 80) player.x = canvas.width - 80;

        // Render Detailed Hero Character
        ctx.fillStyle = "#e53935"; // Jacket
        ctx.fillRect(player.x, player.y + 20, player.width, player.height - 20);
        ctx.fillStyle = "#1976d2"; // Jeans
        ctx.fillRect(player.x + 12, player.y + 75, player.width - 24, 35);
        ctx.fillStyle = "#ffccbc"; // Head
        ctx.fillRect(player.x + 15, player.y, 35, 25);
        ctx.fillStyle = "#ffeb3b"; // Gun
        ctx.fillRect(player.x + player.width - 5, player.y + 45, 30, 9);

        // Render Enemy or Dragon Boss
        if (currentStage === 5) {
            ctx.fillStyle = "#6a1b9a"; // Giant Dragon Boss
            ctx.fillRect(enemy.x - 60, enemy.y - 70, enemy.width + 100, enemy.height + 70);
            ctx.fillStyle = "#ffeb3b";
            ctx.fillRect(enemy.x - 10, enemy.y - 25, 25, 12);
        } else {
            ctx.fillStyle = "#c2185b"; // Enemy thug
            ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            ctx.fillStyle = "#212121";
            ctx.fillRect(enemy.x + 12, enemy.y + 15, 18, 9);
        }

        // Bullets update & rendering
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.speed;
            ctx.fillStyle = "#ffeb3b";
            ctx.fillRect(b.x, b.y, b.width, b.height);

            if (b.x > enemy.x && b.y > enemy.y - 50 && b.y < enemy.y + enemy.height) {
                bullets.splice(i, 1);
                enemy.hp--;
                checkEnemyStatus();
            } else if (b.x > canvas.width) {
                bullets.splice(i, 1);
            }
        }

        if (Math.random() < 0.002 && lives > 0 && document.getElementById("modal").style.display !== "flex") {
            playerDies();
        }

        requestAnimationFrame(gameLoop);
    }

    updateHUD();
    gameLoop();
</script>

</body>
</html>
