<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super App - Real-World Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Live Status Header -->
        <header class="app-header">
            <div class="user-info">
                <i class="fa-solid fa-circle-check glowing-green"></i>
                <span>BX Secure Node Active</span>
            </div>
            <div class="wallet-id">ID: 889921</div>
        </header>

        <!-- Real-Time Balance Card with Live Currency Switch -->
        <section class="balance-card">
            <div class="card-top">
                <p>Live Portfolio Value</p>
                <select id="currencySelector" onchange="switchCurrency()">
                    <option value="USD">USD ($)</option>
                    <option value="BDT">BDT (৳)</option>
                </select>
            </div>
            <h1 id="balanceDisplay">$1,250.45</h1>
            <div class="tax-status">
                <i class="fa-solid fa-shield-halved"></i> 0.1% Master Vault Auto-Tax Routing Active
            </div>
            <div class="action-buttons">
                <button class="btn-action" onclick="executeRealTransaction('Deposit')"><i class="fa-solid fa-arrow-down"></i> Deposit</button>
                <button class="btn-action" onclick="executeRealTransaction('Withdraw')"><i class="fa-solid fa-arrow-up"></i> Withdraw</button>
                <button class="btn-action" onclick="openP2P()"><i class="fa-solid fa-arrows-rotate"></i> P2P / Swap</button>
            </div>
        </section>

        <!-- Real-World Feature Grid -->
        <section class="features-grid">
            <div class="feature-tile" onclick="openTrading()">
                <i class="fa-solid fa-chart-line"></i>
                <span>Spot/Futures</span>
            </div>
            <div class="feature-tile" onclick="openGames()">
                <i class="fa-solid fa-gamepad"></i>
                <span>Casino Arena</span>
            </div>
            <div class="feature-tile" onclick="openMemeLaunch()">
                <i class="fa-solid fa-rocket"></i>
                <span>Meme Launch</span>
            </div>
            <div class="feature-tile" onclick="openAdHub()">
                <i class="fa-solid fa-rectangle-ad"></i>
                <span>Google Ads</span>
            </div>
            <div class="feature-tile" onclick="openSocialFi()">
                <i class="fa-solid fa-users-viewfinder"></i>
                <span>Social-Fi</span>
            </div>
            <div class="feature-tile" onclick="triggerSecretVault()">
                <i class="fa-solid fa-fingerprint"></i>
                <span>Master Vault</span>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
