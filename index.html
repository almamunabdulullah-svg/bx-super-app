<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super App - 3D Crash Game Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #030712; color: #F8FAFC; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #0F172A; padding: 10px 20px; border-bottom: 1px solid #1E293B; flex-shrink: 0; }
        .logo { font-weight: bold; font-size: 1.1rem; color: #38BDF8; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: #94A3B8; text-decoration: none; font-size: 0.85rem; }
        .nav-links a.active { color: #38BDF8; font-weight: bold; }

        .main-container { display: flex; flex-grow: 1; height: calc(100vh - 50px); overflow: hidden; }
        .game-section { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow-y: auto; }
        
        .game-top-bar { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
        .top-btn-group { display: flex; gap: 8px; }
        .top-pill-btn { background: #1E293B; border: 1px solid #334155; color: #38BDF8; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        
        #gameWrapper { display: flex; flex-direction: column; flex-grow: 1; min-height: 280px; position: relative; }
        #gameScreen { flex-grow: 1; background: linear-gradient(to bottom, #020617, #1e1b4b, #312e81); border-radius: 10px; border: 1px solid #334155; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 30px rgba(0,0,0,0.8); }
        
        .sky-layer { position: absolute; width: 200%; height: 100%; background-image: radial-gradient(white 1px, transparent 1px); background-size: 40px 40px; opacity: 0.15; animation: moveStars 20s linear infinite; }
        @keyframes moveStars { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .buildings { position: absolute; bottom: 0; width: 200%; height: 90px; background: repeating-linear-gradient(90deg, #0f172a, #0f172a 30px, #1e293b 30px, #1e293b 60px); animation: moveBuildings 10s linear infinite; opacity: 0.6; }
        @keyframes moveBuildings { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        #planeContainer { position: absolute; bottom: 20%; left: 15%; z-index: 10; transition: transform 0.1s ease-out; }
        #plane { width: 70px; height: 70px; fill: #38BDF8; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.8)); }
        
        .explosion { position: absolute; width: 120px; height: 120px; background: radial-gradient(circle, #f97316 0%, #ef4444 50%, transparent 80%); border-radius: 50%; z-index: 20; transform: scale(0); animation: explode 0.5s ease-out forwards; display: none; }
        @keyframes explode { 0% { transform: scale(0.2); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        #mainMultiplier { font-size: 6rem; font-weight: 900; color: #38BDF8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.6); z-index: 5; letter-spacing: -2px; }
        #mainMultiplier.crashed { color: #EF4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.8); animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translate(4px, 4px); } 50% { transform: translate(-4px, -4px); } 100% { transform: translate(0, 0); } }

        .control-panel { display: flex; gap: 10px; margin-top: 10px; flex-shrink: 0; }
        .bet-box { flex: 1; background: #0F172A; padding: 10px; border-radius: 8px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 6px; }
        
        .input-row { display: flex; position: relative; align-items: center; }
        input[type="number"] { width: 100%; padding: 8px 30px 8px 10px; background: #1E293B; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 0.9rem; }
        .clear-input { position: absolute; right: 10px; background: none; border: none; color: #94A3B8; cursor: pointer; font-size: 1rem; }

        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .quick-btn { padding: 4px; background: #1E293B; color: #E2E8F0; border: 1px solid #334155; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
        .quick-btn:hover { background: #334155; }

        .action-btn { padding: 10px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; }
        .bet-btn { background: #F97316; color: white; }
        .bet-btn:hover { background: #EA580C; }
        .cashout-btn { background: #CA8A04; color: white; display: none; }
        .autoplay-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #94A3B8; }

        .sidebar { width: 320px; background: #0F172A; border-left: 1px solid #1E293B; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { background: linear-gradient(to right, #7c2d12, #9a3412); padding: 10px; font-size: 0.75rem; display: flex; justify-content: space-around; text-align: center; border-bottom: 1px solid #1E293B; }
        .sidebar-header div span { display: block; font-weight: bold; font-size: 0.85rem; color: #FFEDD5; }
        
        .sidebar-feed { flex-grow: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: left; }
        th { background: #1E293B; color: #94A3B8; padding: 6px 8px; position: sticky; top: 0; z-index: 2; }
        td { padding: 6px 8px; border-bottom: 1px solid #1E293B; color: #CBD5E1; }
        .win-text { color: #4ADE80; font-weight: bold; }
        .loss-text { color: #EF4444; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; overflow-y: auto; }
            body { overflow: auto; height: auto; }
            .sidebar { width: 100%; height: 250px; border-left: none; border-top: 1px solid #1E293B; }
            .control-panel { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">BX Dashboard</div>
        <nav class="nav-links">
            <a href="#" class="active">Game Engine</a>
            <a href="#live">Live Feed</a>
            <a href="#account">Account</a>
        </nav>
    </header>

    <div class="main-container">
        <div class="game-section">
            <div class="game-top-bar">
                <div class="top-btn-group">
                    <button class="top-pill-btn">T&C</button>
                    <button class="top-pill-btn">HISTORY</button>
                    <button class="top-pill-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
                </div>
                <span style="font-size:0.85rem; color:#94A3B8;">Balance: <span id="userBalance" style="color:#38BDF8; font-weight:bold;">10000</span> BDT</span>
            </div>

            <div id="gameWrapper">
                <div id="gameScreen">
                    <div class="sky-layer"></div>
                    <div class="buildings"></div>

                    <div id="planeContainer">
                        <svg id="plane" viewBox="0 0 576 512"><path d="M485.2 163.1L248.5 256l236.7 92.9c16.4 6.4 27.3 22.2 27.3 39.8v29.7c0 26.1-21.1 47.2-47.2 47.2-5.9 0-11.7-1.1-17.1-3.3L352 433.5V464c0 26.5-21.5 48-48 48s-48-21.5-48-48v-30.5l-106.2 41.7c-5.4 2.1-11.2 3.3-17.1 3.3-26.1 0-47.2-21.1-47.2-47.2v-29.7c0-17.6 10.9-33.4 27.3-39.8L90.8 256L54.2 163.1C37.8 156.7 27 140.9 27 123.3V93.6C27 67.5 48.1 46.4 74.2 46.4c5.9 0 11.7 1.1 17.1 3.3L256 117.4V48c0-26.5 21.5-48 48-48s48 21.5 48 48v69.4l164.7-67.7c5.4-2.1 11.2-3.3 17.1-3.3c26.1 0 47.2 21.1 47.2 47.2v29.7c0 17.6-10.9 33.4-27.3 39.8z"/></svg>
                    </div>
                    <div id="explosionEffect" class="explosion"></div>

                    <div id="mainMultiplier">1.00x</div>
                </div>
            </div>

            <div class="control-panel">
                <div class="bet-box">
                    <div class="input-row">
                        <input type="number" id="betAmount1" value="40">
                        <button class="clear-input" onclick="setBet(1, 0)">×</button>
                    </div>
                    <div class="buttons-grid">
                        <button class="quick-btn" onclick="setBet(1, 20)">20</button>
                        <button class="quick-btn" onclick="setBet(1, 100)">100</button>
                        <button class="quick-btn" onclick="setBet(1, 300)">300</button>
                        <button class="quick-btn" onclick="setBet(1, 800)">800</button>
                        <button class="quick-btn" onclick="setBet(1, 3000)">3000</button>
                        <button class="quick-btn" onclick="setBet(1, 10000)">10000</button>
                    </div>
                    <div class="autoplay-row">
                        <span>Autoplay</span>
                        <input type="checkbox" id="autoPlay1">
                    </div>
                    <button id="betBtn1" class="action-btn bet-btn" onclick="placeBet(1)">Place a Bet</button>
                    <button id="cashoutBtn1" class="action-btn cashout-btn" onclick="cashOut(1)">Cash Out</button>
                </div>

                <div class="bet-box">
                    <div class="input-row">
                        <input type="number" id="betAmount2" value="40">
                        <button class="clear-input" onclick="setBet(2, 0)">×</button>
                    </div>
                    <div class="buttons-grid">
                        <button class="quick-btn" onclick="setBet(2, 20)">20</button>
                        <button class="quick-btn" onclick="setBet(2, 100)">100</button>
                        <button class="quick-btn" onclick="setBet(2, 300)">300</button>
                        <button class="quick-btn" onclick="setBet(2, 800)">800</button>
                        <button class="quick-btn" onclick="setBet(2, 3000)">3000</button>
                        <button class="quick-btn" onclick="setBet(2, 10000)">10000</button>
                    </div>
                    <div class="autoplay-row">
                        <span>Autoplay</span>
                        <input type="checkbox" id="autoPlay2">
                    </div>
                    <button id="betBtn2" class="action-btn bet-btn" onclick="placeBet(2)">Place a Bet</button>
                    <button id="cashoutBtn2" class="action-btn cashout-btn" onclick="cashOut(2)">Cash Out</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <div>Bets <span id="numBetsCount">2,840</span></div>
                <div>Total <span id="totalBetsAmount">782k BDT</span></div>
                <div>Win <span id="totalWinAmount">340k BDT</span></div>
            </div>
            <div class="sidebar-feed">
                <table>
                    <thead>
                        <tr>
                            <th>USER</th>
                            <th>ODDS</th>
                            <th>BET</th>
                            <th>WIN</th>
                        </tr>
                    </thead>
                    <tbody id="liveFeedBody">
                        <!-- ডাইনামিক ফেক এবং রিয়েল ডাটা এখানে দেখাবে -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let balance = 10000;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let crashAt = 1.00;
        let activeBets = { 1: false, 2: false };
        let gameState = 'IDLE'; 
        let fakeUsersList = [];
        let totalBetsValue = 750000;

        function toggleFullScreen() {
            let elem = document.getElementById("gameWrapper");
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {});
            } else {
                document.exitFullscreen();
            }
        }

        function setBet(boxNum, amount) {
            document.getElementById(betAmount${boxNum}).value = amount;
        }

        function placeBet(boxNum) {
            let betAmt = parseFloat(document.getElementById(betAmount${boxNum}).value);
            if (isNaN(betAmt) || betAmt <= 0 || betAmt > balance) {
                alert('অপর্যাপ্ত ব্যালেন্স বা ভুল পরিমাণ!');
                return;
            }

            balance -= betAmt;
            document.getElementById('userBalance').innerText = balance;
            activeBets[boxNum] = true;

            document.getElementById(betBtn${boxNum}).style.display = 'none';
            document.getElementById(cashoutBtn${boxNum}).style.display = 'block';

            // রিয়েল ইউজারের বেট সাইডবারে যুক্ত করা
            addFeedRow("YOU (Real)", "-", betAmt + " BDT", "Running...", "yellow");
        }

        function cashOut(boxNum) {
            if (!activeBets[boxNum] || gameState !== 'FLYING') return;
            let betAmt = parseFloat(document.getElementById(betAmount${boxNum}).value);
            let win = Math.floor(betAmt * currentMultiplier);
            balance += win;
            document.getElementById('userBalance').innerText = balance;

            activeBets[boxNum] = false;
            document.getElementById(cashoutBtn${boxNum}).style.display = 'none';
            document.getElementById(betBtn${boxNum}).style.display = 'block';
            
            addFeedRow("YOU (Real)", currentMultiplier.toFixed(2) + "x", betAmt + " BDT", win + " BDT", "win");
        }

        function addFeedRow(user, odds, bet, win, statusClass) {
            let tbody = document.getElementById('liveFeedBody');
            let tr = document.createElement('tr');
            
            let winColorStyle = "";
            if(statusClass === "win") winColorStyle = "color: #4ADE80; font-weight:bold;";
            else if(statusClass === "loss") winColorStyle = "color: #EF4444;";
            else winColorStyle = "color: #FACC15;";

            tr.innerHTML = <td>${user}</td><td>${odds}</td><td>${bet}</td><td style="${winColorStyle}">${win}</td>;
            tbody.prepend(tr);
            if(tbody.rows.length > 25) tbody.deleteRow(tbody.rows.length - 1);
        }

        // ফেক ইউজার জেনারেটর ও অটোমেটিক গেম লুপ
        function startCountdown() {
            gameState = 'COUNTDOWN';
            let mElem = document.getElementById('mainMultiplier');
            let count = 3;
            document.getElementById('explosionEffect').style.display = 'none';
            mElem.classList.remove('crashed');
            mElem.innerText = "Next in " + count;

            // নতুন রাউন্ডের জন্য ফেক ডেটা তৈরি
            generateFakeBetsForRound();

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    mElem.innerText = "Next in " + count;
                } else {
                    clearInterval(timer);
                    startTheGame();
                }
            }, 1000);
        }

        function generateFakeBetsForRound() {
            let tbody = document.getElementById('liveFeedBody');
            tbody.innerHTML = "";
            fakeUsersList = [];

            let totalPlayersCount = Math.floor(Math.random() * 800) + 2400;
            document.getElementById('numBetsCount').innerText = totalPlayersCount.toLocaleString();
            
            totalBetsValue += Math.floor(Math.random() * 50000) + 10000;
            document.getElementById('totalBetsAmount').innerText = Math.floor(totalBetsValue / 1000) + "k BDT";

            // ফেক ইউজারদের লিস্ট তৈরি করা যারা গেমের মধ্যে বেট ধরেছে
            for(let i=0; i<15; i++) {
                let maskedUser = "*****" + Math.floor(Math.random() * 90 + 10);
                let betAmt = Math.floor(Math.random() * 15000) + 200;
                let targetMultiplier = parseFloat((Math.random() * 5 + 1.1).toFixed(2));
                
                fakeUsersList.push({
                    user: maskedUser,
                    bet: betAmt,
                    target: targetMultiplier,
                    cashedOut: false
                });

                addFeedRow(maskedUser, "---", betAmt.toLocaleString() + " BDT", "In Play", "yellow");
            }
        }

        function startTheGame() {
            gameState = 'FLYING';
            currentMultiplier = 1.00;
            crashAt = parseFloat((Math.random() * 4 + 1.3).toFixed(2));

            let plane = document.getElementById('planeContainer');
            let bottomPos = 20;
            let leftPos = 15;
            plane.style.bottom = bottomPos + '%';
            plane.style.left = leftPos + '%';
            plane.style.display = 'block';

            if (gameInterval) clearInterval(gameInterval);

            gameInterval = setInterval(() => {
                currentMultiplier = parseFloat((currentMultiplier + 0.03).toFixed(2));
                document.getElementById('mainMultiplier').innerText = currentMultiplier.toFixed(2) + 'x';

                if(bottomPos < 55) bottomPos += 0.15;
                if(leftPos < 40) leftPos += 0.1;
                plane.style.bottom = bottomPos + '%';
                plane.style.left = leftPos + '%';

                // ফেক ইউজারদের অটো ক্যাশআউট হ্যান্ডেল করা (লাইভ দেখাবে কে টাকা তুলল)
                updateFakeUsersAction();

                // অটো-প্লে চেক
                for (let i = 1; i <= 2; i++) {
                    if (activeBets[i] && document.getElementById(autoPlay${i}).checked) {
                        cashOut(i);
                    }
                }

                if (currentMultiplier >= crashAt) {
                    gameOver();
                }
            }, 100);
        }

        function updateFakeUsersAction() {
            let rows = document.getElementById('liveFeedBody').rows;
            for(let i=0; i<fakeUsersList.length; i++) {
                let fUser = fakeUsersList[i];
                if(!fUser.cashedOut && currentMultiplier >= fUser.target) {
                    fUser.cashedOut = true;
                    let winAmount = Math.floor(fUser.bet * fUser.target);
                    if(rows[i]) {
                        rows[i].cells[1].innerText = fUser.target.toFixed(2) + "x";
                        rows[i].cells[3].innerText = winAmount.toLocaleString() + " BDT";
                        rows[i].cells[3].style.color = "#4ADE80";
                        rows[i].cells[3].style.fontWeight = "bold";
                    }
                }
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameState = 'CRASHED';

            let mElem = document.getElementById('mainMultiplier');
            mElem.innerText = "CRASHED (" + crashAt.toFixed(2) + "x)";
            mElem.classList.add('crashed');

            let explosion = document.getElementById('explosionEffect');
            explosion.style.display = 'block';
            document.getElementById('planeContainer').style.display = 'none';

            // যারা ক্রাশের আগে তুলতে পারেনি তাদের রেড মার্ক করা
            let rows = document.getElementById('liveFeedBody').rows;
            for(let i=0; i<fakeUsersList.length; i++) {
                if(!fakeUsersList[i].cashedOut) {
                    if(rows[i]) {
                        rows[i].cells[1].innerText = crashAt.toFixed(2) + "x";
                        rows[i].cells[3].innerText = "0 BDT";
                        rows[i].cells[3].style.color = "#EF4444";
                    }
                }
            }

            // রিয়েল ইউজারের লস হ্যান্ডেল করা
            for (let i = 1; i <= 2; i++) {
                if(activeBets[i]) {
                    addFeedRow("YOU (Real)", crashAt.toFixed(2) + "x", document.getElementById(betAmount${i}).value + " BDT", "0 BDT", "loss");
                }
                activeBets[i] = false;
                document.getElementById(cashoutBtn${i}).style.display = 'none';
                document.getElementById(betBtn${i}).style.display = 'block';
            }

            // ৩ সেকেন্ড পর স্বয়ংক্রিয়ভাবে নতুন রাউন্ড শুরু হবে
            setTimeout(() => {
                startCountdown();
            }, 3000);
        }

        window.onload = function() {
            startCountdown();
        };
    </script>
</body>
</html>
