<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super App - 3D Crash Game Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #030712; color: #F8FAFC; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Navigation Bar */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #0F172A; padding: 10px 20px; border-bottom: 1px solid #1E293B; }
        .logo { font-weight: bold; font-size: 1.2rem; color: #38BDF8; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: #94A3B8; text-decoration: none; font-size: 0.9rem; }
        .nav-links a.active { color: #38BDF8; font-weight: bold; }

        .game-wrapper { display: flex; flex-direction: column; flex-grow: 1; padding: 10px; max-width: 100%; height: calc(100vh - 50px); }

        /* Fullscreen 3D Scene */
        #gameScreen { flex-grow: 1; background: linear-gradient(to bottom, #020617, #1e1b4b, #312e81); border-radius: 12px; border: 1px solid #334155; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
        
        /* Moving Background Elements (Stars & Buildings) */
        .sky-layer { position: absolute; width: 200%; height: 100%; background-image: radial-gradient(white 1px, transparent 1px); background-size: 50px 50px; opacity: 0.15; animation: moveStars 20s linear infinite; }
        @keyframes moveStars { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .buildings { position: absolute; bottom: 0; width: 200%; height: 120px; background: repeating-linear-gradient(90deg, #0f172a, #0f172a 40px, #1e293b 40px, #1e293b 80px); animation: moveBuildings 10s linear infinite; opacity: 0.6; }
        @keyframes moveBuildings { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* Clouds */
        .cloud { position: absolute; background: rgba(255, 255, 255, 0.1); border-radius: 50px; animation: moveClouds linear infinite; }
        @keyframes moveClouds { from { transform: translateX(100vw); } to { transform: translateX(-200px); } }

        /* Plane & VFX */
        #planeContainer { position: absolute; bottom: 20%; left: 20%; z-index: 10; transition: transform 0.1s ease-out; }
        #plane { width: 80px; height: 80px; fill: #38BDF8; filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.8)); }
        
        /* Explosion Particle Effect */
        .explosion { position: absolute; width: 150px; height: 150px; background: radial-gradient(circle, #f97316 0%, #ef4444 50%, transparent 80%); border-radius: 50%; z-index: 20; transform: scale(0); animation: explode 0.5s ease-out forwards; display: none; }
        @keyframes explode { 0% { transform: scale(0.2); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

        /* Giant Multiplier */
        #mainMultiplier { font-size: 10rem; font-weight: 900; color: #38BDF8; text-shadow: 0 0 30px rgba(56, 189, 248, 0.6); z-index: 5; letter-spacing: -5px; }
        #mainMultiplier.crashed { color: #EF4444; text-shadow: 0 0 30px rgba(239, 68, 68, 0.8); animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translate(5px, 5px); } 50% { transform: translate(-5px, -5px); } 100% { transform: translate(0, 0); } }

        /* Control Panel */
        .control-panel { background: #0F172A; padding: 15px; border-radius: 12px; border: 1px solid #334155; display: flex; gap: 15px; margin-top: 10px; }
        .bet-box { flex: 1; background: #1E293B; padding: 12px; border-radius: 8px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
        
        input { width: 100%; padding: 10px; background: #0F172A; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        .buttons-grid { display: flex; gap: 5px; }
        .quick-btn { flex: 1; padding: 6px; background: #334155; color: #E2E8F0; border: none; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        .quick-btn:hover { background: #475569; }

        .action-btn { padding: 12px; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; }
        .bet-btn { background: #16A34A; color: white; }
        .cashout-btn { background: #CA8A04; color: white; display: none; }
        
        .top-info { display: flex; justify-content: space-between; padding: 0 5px; font-size: 0.9rem; color: #94A3B8; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="logo">BX Dashboard</div>
        <nav class="nav-links">
            <a href="index.html" class="active">Game Engine</a>
            <a href="#live">Live Feed</a>
            <a href="#account">Account</a>
        </nav>
    </header>

    <div class="game-wrapper">
        <div class="top-info">
            <span>BX 3D Aviation Engine</span>
            <span>Balance: <span id="userBalance" style="color:#38BDF8; font-weight:bold;">10000</span> BDT</span>
        </div>

        <!-- Fullscreen 3D Scene -->
        <div id="gameScreen">
            <div class="sky-layer"></div>
            <div class="buildings"></div>
            
            <div class="cloud" style="top: 20%; width: 120px; height: 40px; animation-duration: 8s;"></div>
            <div class="cloud" style="top: 40%; width: 180px; height: 60px; animation-duration: 12s;"></div>

            <!-- Plane & Explosion -->
            <div id="planeContainer">
                <svg id="plane" viewBox="0 0 576 512"><path d="M485.2 163.1L248.5 256l236.7 92.9c16.4 6.4 27.3 22.2 27.3 39.8v29.7c0 26.1-21.1 47.2-47.2 47.2-5.9 0-11.7-1.1-17.1-3.3L352 433.5V464c0 26.5-21.5 48-48 48s-48-21.5-48-48v-30.5l-106.2 41.7c-5.4 2.1-11.2 3.3-17.1 3.3-26.1 0-47.2-21.1-47.2-47.2v-29.7c0-17.6 10.9-33.4 27.3-39.8L90.8 256L54.2 163.1C37.8 156.7 27 140.9 27 123.3V93.6C27 67.5 48.1 46.4 74.2 46.4c5.9 0 11.7 1.1 17.1 3.3L256 117.4V48c0-26.5 21.5-48 48-48s48 21.5 48 48v69.4l164.7-67.7c5.4-2.1 11.2-3.3 17.1-3.3c26.1 0 47.2 21.1 47.2 47.2v29.7c0 17.6-10.9 33.4-27.3 39.8z"/></svg>
            </div>
            <div id="explosionEffect" class="explosion"></div>

            <div id="mainMultiplier">1.00x</div>
        </div>

        <!-- Controls (Dual Betting Support) -->
        <div class="control-panel">
            <!-- Bet Panel 1 -->
            <div class="bet-box">
                <input type="number" id="betAmount1" value="100">
                <div class="buttons-grid">
                    <button class="quick-btn" onclick="setBet(1, 10)">10</button>
                    <button class="quick-btn" onclick="setBet(1, 50)">50</button>
                    <button class="quick-btn" onclick="setBet(1, 100)">100</button>
                    <button class="quick-btn" onclick="setBet(1, 1000)">1000</button>
                    <button class="quick-btn" onclick="setBet(1, 5000)">5000</button>
                </div>
                <button id="betBtn1" class="action-btn bet-btn" onclick="placeBet(1)">Bet 1</button>
                <button id="cashoutBtn1" class="action-btn cashout-btn" onclick="cashOut(1)">Cash Out</button>
            </div>

            <!-- Bet Panel 2 -->
            <div class="bet-box">
                <input type="number" id="betAmount2" value="0">
                <div class="buttons-grid">
                    <button class="quick-btn" onclick="setBet(2, 10)">10</button>
                    <button class="quick-btn" onclick="setBet(2, 50)">50</button>
                    <button class="quick-btn" onclick="setBet(2, 0)">Clear</button>
                    <button class="quick-btn" onclick="setBet(2, 1000)">1000</button>
                    <button class="quick-btn" onclick="setBet(2, 10000)">10000</button>
                </div>
                <button id="betBtn2" class="action-btn bet-btn" onclick="placeBet(2)">Bet 2</button>
                <button id="cashoutBtn2" class="action-btn cashout-btn" onclick="cashOut(2)">Cash Out</button>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API for Jet Wind & Bomb Blast Sound Effects
        let audioCtx = null;
        let windNode = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playWindSound() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            let bufferSize = audioCtx.sampleRate * 2;
            let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            let output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            windNode = audioCtx.createBufferSource();
            windNode.buffer = buffer;
            windNode.loop = true;

            let filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, audioCtx.currentTime);

            windNode.connect(filter);
            filter.connect(audioCtx.destination);
            windNode.start();
        }

        function stopWindSound() {
            if (windNode) {
                try { windNode.stop(); } catch(e){}
                windNode = null;
            }
        }

        function playBlastSound() {
            initAudio();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.6);

            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        // --- Game Logic ---
        let balance = 10000;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let isPlaying = false;
        let crashAt = 1.00;

        let activeBets = { 1: false, 2: false };

        function setBet(boxNum, amount) {
            document.getElementById(betAmount${boxNum}).value = amount;
        }

        function placeBet(boxNum) {
            let betAmt = parseFloat(document.getElementById(betAmount${boxNum}).value);
            if (betAmt <= 0 || betAmt > balance) {
                alert('অপর্যাপ্ত ব্যালেন্স!');
                return;
            }

            balance -= betAmt;
            document.getElementById('userBalance').innerText = balance;
            activeBets[boxNum] = true;

            document.getElementById(betBtn${boxNum}).style.display = 'none';
            document.getElementById(cashoutBtn${boxNum}).style.display = 'block';

            if (!isPlaying) {
                startTheGame();
            }
        }

        function startTheGame() {
            isPlaying = true;
            currentMultiplier = 1.00;
            crashAt = (Math.random() * 5 + 1.2).toFixed(2);
            
            playWindSound();
            document.getElementById('mainMultiplier').classList.remove('crashed');
            document.getElementById('explosionEffect').style.display = 'none';

            let plane = document.getElementById('planeContainer');
            let bottomPos = 20;
            let leftPos = 20;

            gameInterval = setInterval(() => {
                currentMultiplier += 0.03;
                document.getElementById('mainMultiplier').innerText = currentMultiplier.toFixed(2) + 'x';

                if(bottomPos < 70) bottomPos += 0.2;
                if(leftPos < 50) leftPos += 0.1;
                plane.style.bottom = bottomPos + '%';
                plane.style.left = leftPos + '%';

                if (currentMultiplier >= crashAt) {
                    gameOver();
                }
            }, 100);
        }

        function cashOut(boxNum) {
            if (!activeBets[boxNum]) return;
            let betAmt = parseFloat(document.getElementById(betAmount${boxNum}).value);
            let win = Math.floor(betAmt * currentMultiplier);
            balance += win;
            document.getElementById('userBalance').innerText = balance;

            activeBets[boxNum] = false;
            document.getElementById(cashoutBtn${boxNum}).style.display = 'none';
            document.getElementById(betBtn${boxNum}).style.display = 'block';
            alert('জিতেছেন: ' + win + ' BDT');
        }

        function gameOver() {
            clearInterval(gameInterval);
            isPlaying = false;
            stopWindSound();
            playBlastSound();

            let mElem = document.getElementById('mainMultiplier');
            mElem.innerText = "CRASHED (" + crashAt + "x)";
            mElem.classList.add('crashed');

            let explosion = document.getElementById('explosionEffect');
            explosion.style.display = 'block';

            for (let i = 1; i <= 2; i++) {
                activeBets[i] = false;
                document.getElementById(cashoutBtn${i}).style.display = 'none';
                document.getElementById(betBtn${i}).style.display = 'block';
            }
        }
    </script>
</body>
</html>
