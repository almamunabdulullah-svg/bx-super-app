<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super App - Master Global Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container 8d-depth">
        <!-- Header Section -->
        <header class="app-header">
            <div class="user-profile">
                <span class="avatar-badge">BX</span>
                <span class="user-id">ID: 889921</span>
            </div>
            <div class="search-bar">
                <input type="text" id="globalSearch" placeholder="Search Coins, P2P, Banking..." onkeyup="searchFeatures()">
            </div>
            <div class="selectors">
                <select id="langSelect" onchange="changeLanguage()"><option value="EN">EN</option><option value="BN">BN</option></select>
                <select id="currencySelect" onchange="changeCurrency()"><option value="USD">USD</option><option value="BDT">BDT</option></select>
            </div>
        </header>

        <!-- Main Dashboard -->
        <main class="dashboard-main">
            <div class="asset-ad-box">
                <div class="total-asset-card">
                    <h3>Total Assets</h3>
                    <p class="balance-val" id="totalBalance">$0.00</p>
                </div>
                <div class="google-ad-box">
                    <span>Google High-CPC Ad Active</span>
                </div>
            </div>

            <!-- Tiles Grid Menu with Direct Links -->
            <div class="tiles-grid">
                <div class="tile-item" onclick="openFeature('game')">🎮 Game & Casino Zone</div>
                <div class="tile-item" onclick="openFeature('p2p')">💱 P2P Trading Hub</div>
                <div class="tile-item" onclick="openFeature('meme')">🪙 Meme Coin Auto-List</div>
                <div class="tile-item" onclick="openFeature('banking')">🏦 BX Secure Banking</div>
                <div class="tile-item" onclick="openFeature('social')">🌐 Social-Fi Hub</div>
                <div class="tile-item" onclick="openFeature('vault')">🔒 Secret Admin Vault</div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
