<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super-App - Ultimate Gaming Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* গ্রাফিক্স ও পারফরম্যান্স বুস্ট */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
        }
        .gaming-glow { animation: pulseGlow 2s infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* লোডিং স্পিনার */
        .lds-ring { display: inline-block; position: relative; width: 40px; height: 40px; }
        .lds-ring div { box-sizing: border-box; display: block; position: absolute; width: 32px; height: 32px; margin: 4px; border: 4px solid #f59e0b; border-radius: 50%; animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite; border-color: #f59e0b transparent transparent transparent; }
        .lds-ring div:nth-child(1) { animation-delay: -0.45s; }
        .lds-ring div:nth-child(2) { animation-delay: -0.3s; }
        .lds-ring div:nth-child(3) { animation-delay: -0.15s; }
        @keyframes lds-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* গেম কার্ডের স্থির সাইজ */
        .game-card-fixed { height: 180px; }
    </style>
</head>
<body class="bg-[#0b0e14] text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center">

    <!-- Top Header -->
    <header class="w-full max-w-md bg-[#0f172a]/95 backdrop-blur-md border-b border-slate-800 p-3.5 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <div class="bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black px-3 py-1 rounded-xl text-lg tracking-wider shadow-md">
                BX
            </div>
            <span class="font-black text-sm tracking-widest text-white">SMOOTH ENGINE</span>
        </div>
        <div class="flex items-center space-x-1.5">
             <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
             </span>
            <span class="text-[10px] font-bold text-emerald-400">SYNCED</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md p-3.5 pb-24 space-y-4">

        <!-- Vault Balance Card -->
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 border border-amber-500/30 p-4 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[11px] uppercase tracking-wider text-amber-400 font-semibold">Core Vault Balance</span>
                <span class="bg-emerald-500/10 text-emerald-400 text-[10px] px-2 py-0.5 rounded-full font-mono">Block: #8942301</span>
            </div>
            <div class="text-2xl font-extrabold text-white mb-3">
                ৳<span id="userBalance">15,000.00</span> <span class="text-xs font-normal text-slate-400">BDT</span>
            </div>
            <div class="flex space-x-2">
                <button onclick="walletAction('Deposit')" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-2 rounded-xl text-xs font-bold transition-all shadow-md flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Deposit</span>
                </button>
                <button onclick="walletAction('Withdraw')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-arrow-right-arrow-left text-amber-400"></i>
                    <span>Withdraw</span>
                </button>
            </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="w-full sticky top-[57px] z-40 bg-[#0b0e14] py-2">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search 5000+ Games (Instant Filter)..." class="w-full bg-[#0f172a] border border-slate-700 text-white rounded-full py-2.5 pl-12 pr-4 text-xs placeholder:text-slate-500 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none transition-all">
            </div>
        </div>

        <!-- Game Grid (This will be populated by the engine) -->
        <div id="loadingOverlay" class="flex justify-center items-center py-10 hidden">
             <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
        </div>

        <div id="gamesGrid" class="grid grid-cols-2 gap-3">
            <!-- Game Cards will appear here dynamically -->
        </div>

        <!-- Single Game Action Modal -->
        <div id="gameModal" class="hidden fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-lg flex items-center justify-center p-4 transition-opacity duration-300 opacity-0" style="opacity: 0;">
            <div class="bg-slate-900 border border-amber-500/50 w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-4 transform scale-95 transition-transform duration-300" style="transform: scale(0.95);">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 id="modalTitle" class="text-xs font-bold text-white uppercase tracking-wider flex items-center space-x-2">
                        <i class="fa-solid fa-circle-play text-amber-500"></i> <span>Live Session</span>
                    </h3>
                    <button onclick="closeModal()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-2.5 py-1 rounded-lg text-xs font-bold transition-all">
                        <i class="fa-solid fa-xmark"></i> Close
                    </button>
                </div>
                <div id="modalBody" class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center space-y-3">
                    <!-- Dynamic Live Engine -->
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="w-full max-w-md bg-[#0f172a]/95 backdrop-blur-lg border-t border-slate-800 fixed bottom-0 z-50 flex justify-around items-center py-2 px-1">
        <a href="#" class="flex flex-col items-center text-amber-500 space-y-0.5">
            <i class="fa-solid fa-fire text-sm"></i>
            <span class="text-[9px] font-semibold">Lobby</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-white space-y-0.5">
            <i class="fa-solid fa-dice text-sm"></i>
            <span class="text-[9px] font-medium">Casino</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-white space-y-0.5">
            <i class="fa-solid fa-ticket text-sm"></i>
            <span class="text-[9px] font-medium">Ticket</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-white space-y-0.5">
            <i class="fa-solid fa-user text-sm"></i>
            <span class="text-[9px] font-medium">Profile</span>
        </a>
    </nav>

    <!-- Ultimate Game Engine Script -->
    <script>
        let balance = 15000.00;
        let activeInterval = null;
        let allGames = []; // This will hold the 5000+ games data

        function updateBal() {
            document.getElementById('userBalance').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2});
        }

        // 1. ASYNC ENGINE: ফেইক এপিআই ডাটা ফেচিং (বাস্তব ইন্টিগ্রেশনে এখানে আপনার এপিআই URL বসবে)
        async function fetchGamesEngine() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            
            // সিমুলেশন: ধরুন এটি একটি বিশাল JSON রেসপন্স যা এপিআই থেকে আসছে
            // বাস্তবে আপনার এপিআই থেকে ৫০০-১০০০ গেমের ডাটা আসবে
            const mockApiResponse = [];
            const categories = ['crash', 'slots', 'arcade'];
            const icons = ['rocket', 'hat-cowboy', 'puzzle-piece', 'car-side', 'gem', 'microchip'];

            // ৫০০০ গেমের ডাটা তৈরি করা হলো (পারফরম্যান্স টেস্টিংয়ের জন্য)
            for (let i = 1; i <= 5000; i++) {
                mockApiResponse.push({
                    id: i,
                    name: `Game ${i} - ${categories[i%3].toUpperCase()}`,
                    category: categories[i%3],
                    icon: icons[i%6],
                    stake: 10 + (i%50), // 10 থেকে 60 টাকার মধ্যে এন্ট্রি ফি
                    multiplier: 500 + (i%2000) // 500x থেকে 2500x
                });
            }

            // ডাটা পাওয়ার পর গ্রিড রেন্ডার করা
            setTimeout(() => {
                allGames = mockApiResponse;
                renderGamesGrid(allGames);
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 800); // 800ms লোডিং সিমুলেশন
        }

        // 2. VIRTUAL RENDERER: স্মুথলি গেম গ্রিড তৈরি করা
        function renderGamesGrid(gamesToRender) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = ''; // আগের লিস্ট পরিষ্কার করা

            // পারফরম্যান্সের জন্য DocumentFragment ব্যবহার করা হচ্ছে (DOM রিফ্লো কমায়)
            const fragment = document.createDocumentFragment();

            // সব গেম লুপ করে কার্ড তৈরি করা
            gamesToRender.forEach(game => {
                const card = document.createElement('div');
                card.className = "game-card-fixed bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 rounded-2xl p-3 flex flex-col justify-between cursor-pointer transition-all shadow-md group";
                card.onclick = () => launchPaidGame(game.name, game.stake, game.category);

                // কার্ডের ভেতরের HTML
                card.innerHTML = `
                    <div class="h-24 rounded-xl bg-gradient-to-br from-${game.category === 'crash' ? 'red' : game.category === 'slots' ? 'amber' : 'blue'}-600/30 to-slate-900 flex flex-col items-center justify-center text-${game.category === 'crash' ? 'red' : game.category === 'slots' ? 'amber' : 'blue'}-400 relative overflow-hidden">
                        <i class="fa-solid fa-${game.icon} text-3xl group-hover:scale-110 transition-transform"></i>
                        <span class="text-[10px] font-mono mt-1 opacity-70">${game.name.split(' - ')[1]}</span>
                    </div>
                    <div class="mt-3">
                        <h4 class="text-xs font-bold text-white flex justify-between">
                            <span>${game.name.split(' - ')[0]}</span>
                            <span class="text-[9px] bg-${game.category === 'crash' ? 'red' : game.category === 'slots' ? 'amber' : 'blue'}-500/20 text-${game.category === 'crash' ? 'red' : game.category === 'slots' ? 'amber' : 'blue'}-400 px-1 rounded">HD</span>
                        </h4>
                        <p class="text-[10px] text-amber-400 mt-0.5">Stake: ৳${game.stake.toFixed(2)}</p>
                    </div>
                `;
                fragment.appendChild(card);
            });

            grid.appendChild(fragment);
        }

        // 3. INSTANT FILTER ENGINE: সার্চ বারের জন্য ইনস্ট্যান্ট ফিল্টারিং
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keyup', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredGames = allGames.filter(game => 
                game.name.toLowerCase().includes(searchTerm) || 
                game.category.toLowerCase().includes(searchTerm)
            );
            // ফিল্টার করা ডাটা দিয়ে পুনরায় গ্রিড রেন্ডার করা (খুব দ্রুত কাজ করবে)
            renderGamesGrid(filteredGames.slice(0, 200)); // পারফরম্যান্সের জন্য প্রথম ২০০টি রেজাল্ট দেখানো
        });


        // Game Launch System (Real Money)
        function launchPaidGame(name, fee, type) {
            if (balance < fee) {
                alert("আপনার ভল্টে পর্যাপ্ত ব্যালেন্স নেই! দয়া করে আগে ডিপোজিট করুন।");
                return;
            }

            // Deduct entry fee immediately on click
            balance -= fee;
            updateBal();

            const modal = document.getElementById('gameModal');
            const modalContent = modal.querySelector
