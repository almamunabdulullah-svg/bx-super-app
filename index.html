<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Global Web3 BNB & Multi-Currency Super-App Ecosystem - 8 Pages Complete</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0B0E14; color: #FFFFFF; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background-color: #0B0E14; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; border: 1px solid #222; }
        .content { padding: 14px; overflow-y: auto; flex-grow: 1; padding-bottom: 90px; scrollbar-width: none; }
        .content::-webkit-scrollbar { display: none; }
        
        .top-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .card { background-color: #181D28; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 10px; flex: 1; }
        .profile-box { display: flex; align-items: center; gap: 10px; cursor: pointer; height: 100%; }
        .avatar { width: 40px; height: 40px; background-color: #F3BA2F; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold; }
        
        .bullet-text { font-size: 15px; font-weight: bold; color: #F3BA2F; }
        .bdt-text { font-size: 10px; color: #0ECB81; margin-top: 2px; }
        .mini-btns { display: flex; gap: 6px; margin-top: 6px; }
        .mini-btn { background-color: rgba(243, 186, 47, 0.2); color: #F3BA2F; border: none; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }

        .quick-swap-box { background: linear-gradient(135deg, #181D28, #12161F); border: 1px solid rgba(243,186,47,0.3); border-radius: 12px; padding: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .price-ticker { background-color: #181D28; border-radius: 10px; padding: 8px 10px; font-size: 10px; color: #F3BA2F; margin-bottom: 10px; display: flex; justify-content: space-between; border: 1px solid rgba(243,186,47,0.15); overflow-x: auto; }
        
        .trade-section { display: flex; gap: 8px; margin-bottom: 12px; }
        .order-form { flex: 1; background: #181D28; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        .order-book { flex: 1; background: #181D28; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); font-size: 10px; }
        .tab-group { display: flex; gap: 4px; margin-bottom: 8px; }
        .tab-pill { flex: 1; padding: 6px; text-align: center; background: #0B0E14; border: none; color: grey; font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .tab-pill.buy-active { background: #0ECB81; color: #000; }
        .tab-pill.sell-active { background: #F6465D; color: #fff; }
        .input-group { margin-bottom: 6px; }
        .input-group label { font-size: 9px; color: grey; display: block; margin-bottom: 2px; }
        .input-group input, .input-group select { width: 100%; background: #0B0E14; border: 1px solid #333; color: #fff; padding: 6px; border-radius: 6px; font-size: 11px; outline: none; }
        .action-btn { width: 100%; padding: 8px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 11px; margin-top: 4px; }
        .btn-buy { background: #0ECB81; color: #000; }
        .btn-sell { background: #F6465D; color: #fff; }
        .chart-box { background: #181D28; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); padding: 8px; margin-bottom: 12px; }
        #chartContainer { width: 100%; height: 180px; }
        .order-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .ask-price { color: #F6465D; }
        .bid-price { color: #0ECB81; }

        .section-title { font-size: 13px; font-weight: bold; color: rgba(255, 255, 255, 0.8); margin: 12px 0 6px 0; display: flex; justify-content: space-between; }
        .tiles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .tile-card { background: #181D28; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .tile-card:hover { border-color: #F3BA2F; }
        .tile-body { padding: 10px; }
        .tile-title { font-size: 12px; font-weight: bold; color: #fff; }
        .tile-desc { font-size: 10px; color: grey; margin-top: 4px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background-color: #12161F; display: flex; justify-content: space-around; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; overflow-x: auto; }
        .nav-btn { background: none; border: none; color: grey; font-size: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; gap: 2px; min-width: 50px; }
        .nav-btn.active { color: #F3BA2F; }
        
        .auth-screen { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: #181D28; padding: 18px; border-radius: 16px; width: 85%; max-width: 340px; border: 1px solid rgba(255,255,255,0.2); text-align: center; }
        .auth-box input { width: 100%; padding: 8px; margin: 6px 0; background: #0B0E14; border: 1px solid #333; color: #fff; border-radius: 6px; outline: none; font-size: 12px; }
        .auth-box button { background: #F3BA2F; color: #000; border: none; padding: 9px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 6px; }
    </style>
</head>
<body>

<div class="auth-screen" id="authScreen">
    <div class="auth-box">
        <h2 style="color: #F3BA2F; margin-bottom: 6px;">🌐 BX Global Web3 Vault</h2>
        <p style="font-size: 11px; color: grey; margin-bottom: 10px;">Connect Trust Wallet, MetaMask or BNB Chain</p>
        <input type="text" id="walletAddressInput" placeholder="Enter Wallet Address or Type 'god'">
        <button type="button" onclick="connectWeb3TrustWallet()">🔗 Connect Trust Wallet / BNB</button>
    </div>
</div>

<div class="app-container">
    <div class="content" id="pageContent"></div>

    <!-- ৮টি স্বতন্ত্র পেজ নেভিগেশন বার -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('home')"><span>🏠</span>Home</button>
        <button class="nav-btn" onclick="switchTab('trade')"><span>📈</span>Trade</button>
        <button class="nav-btn" onclick="switchTab('p2p')"><span>🤝</span>P2P</button>
        <button class="nav-btn" onclick="switchTab('play')"><span>🎮</span>BX Play</button>
        <button class="nav-btn" onclick="switchTab('deposit')"><span>📥</span>Deposit</button>
        <button class="nav-btn" onclick="switchTab('withdraw')"><span>📤</span>Withdraw</button>
        <button class="nav-btn" onclick="switchTab('robots')"><span>🤖</span>Robots</button>
        <button class="nav-btn" onclick="switchTab('wallet')"><span>💼</span>Wallet</button>
    </div>
</div>

<script>
    let isGodModeActive = false;
    let connectedWalletAddress = "Not Connected";
    let userWalletBalance = "1,000.00 BULLET";
    let companyReserveBNB = 125.40;
    let currentPair = "SOL/USDT";
    let liveWebSocket = null;
    let chart, candleSeries;
    
    let globalEcosystemCoins = [
        { name: "🪙 Mr. Bullet (PRIMARY)", symbol: "BULLET", price: "$12.50", change: "+145.2%" },
        { name: "🪙 Bitcoin", symbol: "BTC", price: "$67,420", change: "+3.4%" },
        { name: "🪙 Ethereum", symbol: "ETH", price: "$3,510", change: "+2.1%" },
        { name: "🪙 Solana", symbol: "SOL", price: "$103.86", change: "+4.25%" },
        { name: "🐸 PepeCoin", symbol: "PEPE", price: "$0.000012", change: "+22.5%" },
        { name: "🐕 Dogecoin", symbol: "DOGE", price: "$0.142", change: "+5.1%" }
    ];

    function connectWeb3TrustWallet() {
        let val = document.getElementById('walletAddressInput').value.trim();
        connectedWalletAddress = val ? val : "0x30Ad271... (TrustWallet)";
        if (val.toLowerCase() === "god" || val === "420mn420") {
            isGodModeActive = true;
            alert("👑 God Mode Activated! 100% Win Rate & Full Supreme Control Granted.");
        } else {
            alert("✅ Connected with Smart Contract: 0x30Ad271CcBA208215E80b607eFBd389486c9CF6A");
        }
        document.getElementById('authScreen').style.display = 'none';
        switchTab('home');
    }

    function executeQuickSwap() {
        let amt = document.getElementById('quickSwapAmt').value;
        if (!amt) { alert("Please enter swap amount!"); return; }
        alert(`✅ Successfully swapped ${amt} coins via BNB Chain Smart Contract!`);
    }

    function playInteractiveGame(name) {
        let bet = prompt(`Enter amount to play ${name}:`, "10");
        if (!bet) return;
        let win = isGodModeActive || Math.random() < 0.4;
        if (win) {
            alert(`🎉 Congratulations! You won ${bet * 2.5} BULLET in ${name} (God Mode/Engine Active).`);
        } else {
            alert(`😢 You lost ${bet} BULLET. Try again!`);
        }
    }

    // --- Page 1: Home ---
    function renderHome() {
        return `
            <div class="top-row">
                <div class="card">
                    <div class="profile-box" onclick="switchTab('wallet')">
                        <div class="avatar">🎯</div>
                        <div>
                            <div style="font-weight: bold; font-size: 11px; color: #F3BA2F;">${connectedWalletAddress}</div>
                            <div style="color: #0ECB81; font-size: 9px;">${isGodModeActive ? '👑 GOD MODE' : '🛡️ Contract Linked'}</div>
                        </div>
                    </div>
                </div>
                <div class="card" style="border-color: rgba(243, 186, 47, 0.3);">
                    <div class="bullet-text">${userWalletBalance}</div>
                    <div class="bdt-text">BNB Chain Synced</div>
                    <div class="mini-btns">
                        <button class="mini-btn" onclick="switchTab('deposit')">Deposit</button>
                        <button class="mini-btn" onclick="switchTab('withdraw')">Withdraw</button>
                    </div>
                </div>
            </div>
            <div class="quick-swap-box">
                <div>
                    <div style="font-size: 11px; font-weight: bold; color: #F3BA2F;">⚡ Quick Swap to Bullet</div>
                    <div style="font-size: 9px; color: grey;">Instant Trust Wallet Exchange</div>
                </div>
                <div style="display:flex; gap:4px;">
                    <input type="number" id="quickSwapAmt" placeholder="Amt" style="width:55px; background:#0B0E14; border:1px solid #333; color:#fff; padding:4px; border-radius:4px; font-size:10px;">
                    <button class="mini-btn" onclick="executeQuickSwap()">Swap</button>
                </div>
            </div>
            <div class="price-ticker">${globalEcosystemCoins.map(c => `<span>${c.symbol}: ${c.price}</span>`).join('')}</div>
            <div class="section-title"><span>🚀 Auto-Synced Coins & Memes</span></div>
            <div class="tiles-grid">
                ${globalEcosystemCoins.map(coin => `
                    <div class="tile-card" onclick="switchTab('trade')">
                        <div class="tile-body">
                            <div class="tile-title">${coin.name}</div>
                            <div class="tile-desc">Price: ${coin.price} | <span style="color:#0ECB81">${coin.change}</span></div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    // --- Page 2: Trade ---
    function renderTrade() {
        return `
            <div class="chart-box">
                <div style="display:flex; justify-content:space-between; font-size:10px; color:grey; margin-bottom:4px;">
                    <span style="color:#F3BA2F; font-weight:bold;">${currentPair}</span>
                    <span style="color:#0ECB81">Live Binance DEX Active</span>
                </div>
                <div id="chartContainer"></div>
            </div>
            <div class="trade-section">
                <div class="order-form">
                    <div class="tab-group">
                        <button class="tab-pill buy-active" onclick="alert('Buy Mode Selected')">Buy</button>
                        <button class="tab-pill" onclick="alert('Sell Mode Selected')">Sell</button>
                    </div>
                    <div class="input-group"><label>Price</label><input type="text" id="orderPrice" value="103.86"></div>
                    <div class="input-group"><label>Amount</label><input type="text" id="orderAmount" placeholder="0.00"></div>
                    <button class="action-btn btn-buy" onclick="alert('✅ Trade Order Executed Successfully!')">Execute Order</button>
                </div>
                <div class="order-book">
                    <div style="font-weight:bold; color:grey; margin-bottom:4px; border-bottom:1px solid #333;">Order Book</div>
                    <div class="order-row ask-price"><span>103.92</span><span>3.07K</span></div>
                    <div style="font-size:11px; font-weight:bold; color:#0ECB81; margin:4px 0;" id="liveSpreadPrice">103.86 ⚡</div>
                    <div class="order-row bid-price"><span>103.85</span><span>58.11</span></div>
                </div>
            </div>
        `;
    }

    // --- Page 3: P2P ---
    function renderP2P() {
        return `
            <h3 style="color:#F3BA2F; margin-bottom:10px;">🤝 P2P Secure Crypto Marketplace</h3>
            <p style="font-size:10px; color:grey; margin-bottom:12px;">Direct bank & mobile financial transfer protected by contract escrow.</p>
            <div style="background:#181D28; padding:12px; border-radius:12px; margin-bottom:10px; font-size:11px;">
                <div style="font-weight:bold; color:#F3BA2F; margin-bottom:6px;">Merchant: CryptoKing_BD (99.4% Completion)</div>
                <div style="color:grey; font-size:10px; margin-bottom:8px;">Available: 5,000 BULLET | Rate: 125 BDT/BULLET</div>
                <button class="mini-btn" style="width:100%; padding:8px;" onclick="alert('✅ P2P Escrow Order Started via bKash/Nagad!')">Buy via bKash / Nagad / Bank</button>
            </div>
        `;
    }

    // --- Page 4: BX Play ---
    function renderPlay() {
        return `
            <div style="text-align:center; padding-top:10px;">
                <h3 style="color:#F3BA2F; margin-bottom:6px;">🎮 BX Play Arena</h3>
                <p style="font-size:11px; color:grey; margin-bottom:14px;">External APIs connected with 100% God Mode Win option.</p>
                <div class="tiles-grid">
                    <div class="tile-card" onclick="playInteractiveGame('Bullet Aviator')">
                        <div class="tile-body"><div class="tile-title">🚀 Bullet Aviator</div><div class="tile-desc">Guaranteed Win Engine</div></div>
                    </div>
                    <div class="tile-card" onclick="playInteractiveGame('Bullet Jackpot')">
                        <div class="tile-body"><div class="tile-title">🎯 Bullet Jackpot</div><div class="tile-desc">External API Supported</div></div>
                    </div>
                </div>
            </div>
        `;
    }

    // --- Page 5: Deposit ---
    function renderDeposit() {
        return `
            <div style="padding:10px; text-align:center;">
                <h3 style="color:#F3BA2F; margin-bottom:10px;">📥 Deposit Assets & QR Code</h3>
                <div style="background:#fff; padding:10px; display:inline-block; border-radius:8px; margin:10px 0;">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=0x30Ad271CcBA208215E80b607eFBd389486c9CF6A" alt="QR">
                </div>
                <div style="font-size:10px; color:#F3BA2F; word-break:break-all; background:#181D28; padding:8px; border-radius:6px; border:1px solid #333; margin-bottom:10px;">
                    0x30Ad271CcBA208215E80b607eFBd389486c9CF6A
                </div>
                <button class="mini-btn" style="width:100%; padding:8px;" onclick="alert('Deposit Address Copied to Clipboard!')">Copy Deposit Address</button>
            </div>
        `;
    }

    // --- Page 6: Withdraw ---
    function renderWithdraw() {
        return `
            <div style="padding:10px;">
                <h3 style="color:#F3BA2F; margin-bottom:10px;">📤 Withdraw & Banking Payout</h3>
                <div class="input-group"><label>Select Payout Method</label>
                    <select><option>Trust Wallet / Web3 Address</option><option>bKash / Nagad / Rocket</option><option>Global Bank Transfer</option></select>
                </div>
                <div class="input-group"><label>Amount</label><input type="number" placeholder="Enter Amount"></div>
                <button class="mini-btn" style="width:100%; padding:8px; margin-top:10px;" onclick="alert('✅ Withdrawal Request Submitted Successfully!')">Confirm Payout</button>
            </div>
        `;
    }

    // --- Page 7: Robots Manager ---
    function renderRobots() {
        return `
            <div style="padding:10px;">
                <h3 style="color:#F3BA2F; margin-bottom:10px;">🤖 7-Robot AI Security Panel</h3>
                <div style="background:#181D28; padding:12px; border-radius:12px; font-size:11px; color:#ccc; line-height:1.6;">
                    <div>🏢 <b>Master Reserve:</b> ${companyReserveBNB.toFixed(2)} BNB</div>
                    <div>⚖️ <b>Contract Status:</b> <span style="color:#0ECB81">Active & Protected</span></div>
                    <hr style="border-color:#333; margin:8px 0;">
                    <div>🤖 <b>Robot-1 (Speed & Binding):</b> <span style="color:#0ECB81">Active</span></div>
                    <div>🛡️ <b>Robot-2 (Vault Guard):</b> <span style="color:#0ECB81">Active</span></div>
                    <div>⚡ <b>Robot-3 (BNB Sync Master):</b> <span style="color:#0ECB81">Active</span></div>
                    <div>🎮 <b>Robot-4 (Win Engine):</b> <span style="color:#0ECB81">Active</span></div>
                    <div>🔄 <b>Robot-5 (P2P Tax & Swap Bot):</b> <span style="color:#0ECB81">Active</span></div>
                    <div>👮 <b>Robot-6 (Threat Neutralizer):</b> <span style="color:#0ECB81">Active</span></div>
                    <div>💬 <b>Robot-7 (Encrypted Hub):</b> <span style="color:#0ECB81">Active</span></div>
                </div>
            </div>
        `;
    }

    // --- Page 8: Wallet & Settings ---
    function renderWallet() {
        return `
            <div style="padding:10px;">
                <h3 style="color:#F3BA2F; margin-bottom:10px;">💼 Web3 Portfolio & Settings</h3>
                <div style="background:#181D28; padding:12px; border-radius:12px; font-size:11px; color:grey; line-height:1.7;">
                    Connected Account: <span style="color:#fff">${connectedWalletAddress}</span><br>
                    Balance: <span style="color:#F3BA2F">${userWalletBalance}</span><br>
                    Contract: <span style="color:#0ECB81">0x30Ad271CcBA208215E80b607eFBd389486c9CF6A</span><br>
                    Device Binding: <span style="color:#0ECB81">Secured</span><br>
                    <button class="mini-btn" style="margin-top:10px; width:100%; padding:8px;" onclick="switchTab('robots')">🤖 Open Robot Control Panel</button>
                </div>
            </div>
        `;
    }

    // Router Function for 8 Pages
    function switchTab(tabName) {
        const buttons = document.querySelectorAll('.nav-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        const content = document.getElementById('pageContent');
        
        if (tabName === 'home') { buttons[0].classList.add('active'); content.innerHTML = renderHome(); }
        else if (tabName === 'trade') { 
            buttons[1].classList.add('active'); content.innerHTML = renderTrade();
            setTimeout(() => {
                const container = document.getElementById('chartContainer');
                if (container) {
                    container.innerHTML = "";
                    chart = LightweightCharts.createChart(container, { width: container.clientWidth, height: 180, layout: { background: { type: 'solid', color: '#181D28' }, textColor: '#d1d4dc' } });
                    candleSeries = chart.addCandlestickSeries();
                    candleSeries.setData([{ time: '2026-08-01', open: 70.5, high: 77.3, low: 68.5, close: 74.2 }, { time: '2026-09-01', open: 102.1, high: 105.8, low: 101.2, close: 103.86 }]);
                }
            }, 100);
        }
        else if (tabName === 'p2p') { buttons[2].classList.add('active'); content.innerHTML = renderP2P(); }
        else if (tabName === 'play') { buttons[3].classList.add('active'); content.innerHTML = renderPlay(); }
        else if (tabName === 'deposit') { buttons[4].classList.add('active'); content.innerHTML = renderDeposit(); }
        else if (tabName === 'withdraw') { buttons[5].classList.add('active'); content.innerHTML = renderWithdraw(); }
        else if (tabName === 'robots') { buttons[6].classList.add('active'); content.innerHTML = renderRobots(); }
        else if (tabName === 'wallet') { buttons[7].classList.add('active'); content.innerHTML = renderWallet(); }
    }
</script>

</body>
</html>
