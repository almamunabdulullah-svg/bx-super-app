<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super App - Live Real Games Ecosystem</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center">

    <header class="w-full max-w-md bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black px-3 py-1 rounded-xl text-lg tracking-wider shadow-lg">
                BX
            </div>
            <span class="font-bold text-base tracking-wide text-white">BX SUPER-APP</span>
        </div>
        <div class="flex items-center space-x-2">
            <span class="flex h-2.5 w-2.5 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
            </span>
            <span class="text-xs font-semibold text-emerald-400">REAL MONEY LIVE</span>
        </div>
    </header>

    <main class="w-full max-w-md p-4 pb-24 space-y-4">

        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 border border-indigo-500/30 p-5 shadow-2xl">
            <div class="flex justify-between items-start mb-2">
                <span class="text-xs uppercase tracking-widest text-indigo-300 font-semibold">User Wallet Balance</span>
                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] px-2.5 py-0.5 rounded-full">Secure Vault</span>
            </div>
            <div class="text-3xl font-extrabold tracking-tight text-white mb-4">
                $<span id="userBalance">500.00</span> <span class="text-xs font-normal text-slate-400">USD</span>
            </div>
            <div class="flex space-x-3">
                <button onclick="walletAction('Deposit')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 px-4 rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Deposit Funds</span>
                </button>
                <button onclick="walletAction('Withdraw')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 py-2.5 px-4 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-arrow-up-right-from-square text-emerald-400"></i>
                    <span>Withdraw Profit</span>
                </button>
            </div>
        </div>

        <div id="gameArena" class="hidden bg-slate-900 border-2 border-indigo-500/60 rounded-3xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="activeGameTitle" class="text-sm font-bold text-white uppercase tracking-wider flex items-center space-x-2">
                    <i class="fa-solid fa-gamepad text-indigo-400"></i> <span>Game Arena</span>
                </h3>
                <button onclick="closeGame()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1 rounded-lg text-xs font-bold transition-all">
                    <i class="fa-solid fa-xmark"></i> Close
                </button>
            </div>

            <div id="gameContentArea" class="bg-slate-950 p-5 rounded-2xl border border-slate-800 text-center space-y-3">
                </div>
        </div>

        <div>
            <div class="flex justify-between items-center mb-3 px-1">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Select Game to Play</h3>
                <span class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded-md">Live Platform</span>
            </div>

            <div class="grid grid-cols-4 gap-3">
                <div onclick="openGame('Casino & Slots')" class="group bg-slate-900 hover:bg-indigo-950 border border-slate-800 hover:border-indigo-500 p-3 rounded-2xl flex flex-col items-center justify-center space-y-2 cursor-pointer transition-all shadow">
                    <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-dice"></i>
                    </div>
                    <span class="text-[11px] font-medium text-slate-300 group-hover:text-white text-center">Casino</span>
                </div>

                <div onclick="openGame('Teen Patti')" class="group bg-slate-900 hover:bg-indigo-950 border border-slate-800 hover:border-indigo-500 p-3 rounded-2xl flex flex-col items-center justify-center space-y-2 cursor-pointer transition-all shadow">
                    <div class="w-12 h-12 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <span class="text-[11px] font-medium text-slate-300 group-hover:text-white text-center">Teen Patti</span>
                </div>

                <div onclick="openGame('Aviator Crash')" class="group bg-slate-900 hover:bg-indigo-950 border border-slate-800 hover:border-indigo-500 p-3 rounded-2xl flex flex-col items-center justify-center space-y-2 cursor-pointer transition-all shadow">
                    <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-rocket"></i>
                    </div>
                    <span class="text-[11px] font-medium text-slate-300 group-hover:text-white text-center">Crash</span>
                </div>

                <div onclick="openGame('Ludo King')" class="group bg-slate-900 hover:bg-indigo-950 border border-slate-800 hover:border-indigo-500 p-3 rounded-2xl flex flex-col items-center justify-center space-y-2 cursor-pointer transition-all shadow">
                    <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-chess-board"></i>
                    </div>
                    <span class="text-[11px] font-medium text-slate-300 group-hover:text-white text-center">Ludo</span>
                </div>
            </div>
        </div>

        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 text-center">
            <p class="text-xs text-slate-400">Contract: <span class="text-indigo-400 font-mono">Ox30Ad271CcBA...6.9CF6A</span></p>
            <p class="text-[10px] text-emerald-400 mt-1">All bets are automatically synced and profits are added directly to your wallet.</p>
        </div>

    </main>

    <nav class="w-full max-w-md bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 fixed bottom-0 z-50 flex justify-around items-center py-2.5 px-2">
        <a href="#" class="flex flex-col items-center text-blue-500 space-y-1">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-semibold">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1">
            <i class="fa-solid fa-gamepad text-base"></i>
            <span class="text-[10px] font-medium">Games</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1">
            <i class="fa-solid fa-wallet text-base"></i>
            <span class="text-[10px] font-medium">Wallet</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1">
            <i class="fa-solid fa-gear text-base"></i>
            <span class="text-[10px] font-medium">Settings</span>
        </a>
    </nav>

    <script>
        let balance = 500.00;

        function updateBalanceDisplay() {
            document.getElementById('userBalance').innerText = balance.toFixed(2);
        }

        function openGame(gameName) {
            document.getElementById('gameArena').classList.remove('hidden');
            document.getElementById('activeGameTitle').innerHTML = `<i class="fa-solid fa-gamepad text-indigo-400"></i> <span>${gameName} - Live Play</span>`;
            
            let contentArea = document.getElementById('gameContentArea');

            if (gameName === 'Casino & Slots') {
                contentArea.innerHTML = `
                    <div class="space-y-3">
                        <div class="text-xl font-bold text-amber-400 tracking-wider">🎰 SLOT MACHINE</div>
                        <p class="text-xs text-slate-400">Bet $20 per spin. Match 3 symbols to win $100!</p>
                        <div id="slotScreen" class="text-3xl font-black bg-slate-900 py-3 rounded-xl tracking-widest text-white">🍒 🍋 🍊</div>
                        <button onclick="playSlots()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow">Spin Slots ($20)</button>
                    </div>
                `;
            } else if (gameName === 'Teen Patti') {
                contentArea.innerHTML = `
                    <div class="space-y-3">
                        <div class="text-xl font-bold text-purple-400 tracking-wider">🃏 TEEN PATTI TABLE</div>
                        <p class="text-xs text-slate-400">Place your blind bet and test your cards!</p>
                        <div class="text-2xl font-black bg-slate-900 py-3 rounded-xl text-white">🂡 🂮 🂤</div>
                        <button onclick="playCardGame()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow">Play Hand ($50)</button>
                    </div>
                `;
            } else if (gameName === 'Aviator Crash') {
                contentArea.innerHTML = `
                    <div class="space-y-3">
                        <div class="text-xl font-bold text-emerald-400 tracking-wider">🚀 CRASH MULTIPLIER</div>
                        <p id="crashStatus" class="text-xs text-slate-400">Multiplier is rising fast! Cash out before crash.</p>
                        <div id="multiplierDisplay" class="text-3xl font-black bg-slate-900 py-3 rounded-xl text-emerald-400">1.00x</div>
                        <button onclick="startCrashGame()" id="crashBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow">Start & Cashout ($25)</button>
                    </div>
                `;
            } else {
                contentArea.innerHTML = `
                    <div class="space-y-3">
                        <div class="text-xl font-bold text-blue-400 tracking-wider">🎲 ${gameName.toUpperCase()}</div>
                        <p class="text-xs text-slate-400">Roll dice and win instant crypto rewards!</p>
                        <button onclick="genericWin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow">Roll & Win ($10)</button>
                    </div>
                `;
            }
        }

        function closeGame() {
            document.getElementById('gameArena').classList.add('hidden');
        }

        function playSlots() {
            if (balance < 20) { alert("Low balance!"); return; }
            balance -= 20;
            updateBalanceDisplay();
            let symbols = ["💎", "🍋", "🍒", "⭐", "🔔"];
            let s1 = symbols[Math.floor(Math.random()*symbols.length)];
            let s2 = symbols[Math.floor(Math.random()*symbols.length)];
            let s3 = symbols[Math.floor(Math.random()*symbols.length)];
            document.getElementById('slotScreen').innerText = `${s1} ${s2} ${s3}`;
            if (s1 === s2 && s2 === s3) {
                balance += 100;
                alert("Jackpot! You won $100!");
            } else {
                alert("No match. Try again!");
            }
            updateBalanceDisplay();
        }

        function playCardGame() {
            if (balance < 50) { alert("Low balance!"); return; }
            balance -= 50;
            updateBalanceDisplay();
            if (Math.random() > 0.5) {
                balance += 120;
                alert("You won the Teen Patti hand! +$120");
            } else {
                alert("You lost the hand!");
            }
            updateBalanceDisplay();
        }

        function startCrashGame() {
            if (balance < 25) { alert("Low balance!"); return; }
            balance -= 25;
            updateBalanceDisplay();
            let mult = 1.00;
            let btn = document.getElementById('crashBtn');
            btn.disabled = true;
            let interval = setInterval(() => {
                mult += 0.25;
                document.getElementById('multiplierDisplay').innerText = mult.toFixed(2) + 'x';
                if (mult >= 2.50) {
                    clearInterval(interval);
                    balance += 60;
                    alert("Cashed out successfully at 2.50x! Won $60");
                    updateBalanceDisplay();
                    btn.disabled = false;
                }
            }, 300);
        }

        function genericWin() {
            if (balance < 10) { alert("Low balance!"); return; }
            balance -= 10;
            if (Math.random() > 0.4) {
                balance += 25;
                alert("Won $25!");
            } else {
                alert("Lost round!");
            }
            updateBalanceDisplay();
        }

        function walletAction(type) {
            if (type === 'Deposit') {
                balance += 100;
                alert("Deposit successful! +$100 added to vault.");
            } else {
                alert("Profit withdrawal request sent to contract: Ox30Ad271CcBA...6.9CF6A");
            }
            updateBalanceDisplay();
        }
    </script>
</body>
</html>
