<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Super App - Global Crypto & Fintech Ecosystem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header / Global Switcher -->
        <header class="app-header">
            <div class="logo">BX Super App</div>
            <div class="global-controls">
                <select id="currencySelector" onchange="updateCurrency()">
                    <option value="USD">USD ($)</option>
                    <option value="BDT">BDT (৳)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="AED">AED (د.إ)</option>
                </select>
                <button onclick="openGodModeModal()" class="god-btn">🔒 God Mode</button>
            </div>
        </header>

        <!-- Dashboard Assets Overview -->
        <section class="dashboard-card">
            <h3>My Wallet Assets</h3>
            <h1 id="balanceDisplay">৳0.00005</h1>
            <div class="action-buttons">
                <button>Send</button>
                <button>Receive</button>
                <button>History</button>
                <button>Approvals</button>
            </div>
        </section>

        <!-- Quick Modules & Navigation -->
        <section class="modules-grid">
            <div class="module-box" onclick="location.href='game.html'">
                <h3>🎮 BX Gaming & Casino</h3>
                <p>70% Company / 30% User Win Ratio</p>
            </div>
            <div class="module-box" onclick="alert('AI Messaging & Multi-Tasking Bot Active')">
                <h3>🤖 Binance AI Bot</h3>
                <p>Smart Trading & Auto Tax (0.1%)</p>
            </div>
            <div class="module-box" onclick="alert('BX Virtual Bank Connected to Blockchain')">
                <h3>🏦 BX Virtual Bank</h3>
                <p>Global Routing & 200 Country Support</p>
            </div>
        </section>
    </div>

    <!-- God Mode Modal -->
    <div id="godModal" class="modal">
        <div class="modal-content">
            <h2>Master God Mode Access</h2>
            <p>Master Contract: <code>0x30Ad271CcBA208215E80b607eFBd389486c9CF6A</code></p>
            <input type="password" id="masterPass" placeholder="Enter Master Password (420MM420)">
            <button onclick="verifyGodMode()">Unlock Backend</button>
            <button onclick="closeGodModeModal()">Cancel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
