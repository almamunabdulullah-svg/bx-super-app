<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Turbo Crash - Jet High Speed Gaming</title>
    <style>
        body {
            margin: 0;
            background: #120808;
            color: #ffaa00;
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .game-container {
            width: 90%;
            max-width: 600px;
            background: #210d0d;
            border: 2px solid #ff4400;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 68, 0, 0.4);
            text-align: center;
        }
        h1 {
            color: #ff4400;
            font-size: 26px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 68, 0, 0.6);
        }
        #multiplier {
            font-size: 52px;
            font-weight: bold;
            color: #ffaa00;
            margin: 20px 0;
            text-shadow: 0 0 15px rgba(255, 170, 0, 0.5);
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        input, button {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            outline: none;
        }
        input {
            background: #331414;
            color: #fff;
            border: 1px solid #ff4400;
            width: 120px;
            text-align: center;
        }
        button {
            background: #ff4400;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #cc3700;
        }
        #cashout-btn {
            background: #ffaa00;
            color: #120808;
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>BX TURBO CRASH</h1>
        <p>Afterburner Jet Flight Protocol</p>
        <div id="multiplier">1.00x</div>
        
        <div class="controls">
            <input type="number" id="bet-amount" value="25" min="1">
            <button id="bet-btn" onclick="placeTurboBet()">TURBO BET</button>
            <button id="cashout-btn" onclick="turboCashOut()">EJECT WIN</button>
        </div>
    </div>

    <script>
        let gameInterval;
        let currentMultiplier = 1.00;
        let isPlaying = false;
        let crashed = false;

        function placeTurboBet() {
            let bet = document.getElementById('bet-amount').value;
            if(bet <= 0) return alert("Enter valid bet!");

            document.getElementById('bet-btn').style.display = 'none';
            document.getElementById('cashout-btn').style.display = 'inline-block';
            
            currentMultiplier = 1.00;
            isPlaying = true;
            crashed = false;

            let crashPoint = (Math.random() * 4 + 1.1).toFixed(2);

            gameInterval = setInterval(() => {
                if(currentMultiplier >= crashPoint) {
                    clearInterval(gameInterval);
                    crashed = true;
                    isPlaying = false;
                    document.getElementById('multiplier').innerText = "ENGINE STALL (" + crashPoint + "x)";
                    document.getElementById('bet-btn').style.display = 'inline-block';
                    document.getElementById('cashout-btn').style.display = 'none';
                } else {
                    currentMultiplier += 0.015;
                    document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + "x";
                }
            }, 40);
        }

        function turboCashOut() {
            if(!isPlaying || crashed) return;
            clearInterval(gameInterval);
            isPlaying = false;
            let winAmount = (document.getElementById('bet-amount').value * currentMultiplier).toFixed(2);
            alert("Ejected Safely! Won: " + winAmount);
            document.getElementById('bet-btn').style.display = 'inline-block';
            document.getElementById('cashout-btn').style.display = 'none';
        }
    </script>
</body>
</html>
