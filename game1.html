<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Aviator - Game 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body {
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 480px;
            background: #0f1c3f;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        /* Top Bar */
        .top-bar {
            background: #080d1e;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1c2a54;
        }
        .history-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .history-list::-webkit-scrollbar {
            display: none;
        }
        .history-pill {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
            background: #172a45;
            color: #4ade80;
        }
        .history-pill.low { color: #60a5fa; }
        .history-pill.high { color: #f43f5e; }
        
        .menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        /* Canvas Area / Visuals */
        .stage-area {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1b2a4a 0%, #0a1128 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 30px 30px;
            opacity: 0.3;
        }
        .clouds {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: url('https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg') repeat-x; /* placeholder styling or CSS clouds */
            opacity: 0.15;
        }
        
        .multiplier-display {
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            z-index: 10;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }
        .status-text {
            font-size: 15px;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 5px;
            z-index: 10;
            text-transform: uppercase;
        }
        .user-tag {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 12px;
            color: #94a3b8;
            z-index: 10;
        }

        /* Plane CSS/Graphic simulation */
        .plane-container {
            position: absolute;
            bottom: 30%;
            left: 20%;
            width: 90px;
            height: 60px;
            z-index: 5;
            transition: transform 0.2s ease;
            display: none;
        }
        .plane {
            width: 100%;
            height: 100%;
            background: #fbbf24;
            border-radius: 50% 20% 20% 50%;
            position: relative;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
        }
        .plane::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 30px;
            width: 30px;
            height: 10px;
            background: #fff;
            border-radius: 5px;
        }

        /* Bottom Control Panel */
        .control-panel {
            background: #0b132b;
            padding: 15px;
            border-top: 2px solid #1c2a54;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #132247;
            border-radius: 10px;
            padding: 8px 12px;
            border: 1px solid #22366b;
        }
        .bet-input-box {
            display: flex;
            align-items: center;
            background: #080d1e;
            border-radius: 8px;
            padding: 4px 10px;
            width: 130px;
            border: 1px solid #1f3160;
        }
        .currency-icon {
            color: #fbbf24;
            font-weight: bold;
            margin-right: 5px;
        }
        .bet-input {
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            outline: none;
        }
        .bet-modifiers {
            display: flex;
            gap: 5px;
        }
        .mod-btn {
            background: #1c2a54;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .mod-btn:active {
            background: #2b417e;
        }

        .auto-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94a3b8;
            padding: 0 4px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #22c55e;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        .btn-bet { background-color: #22c55e; }
        .btn-cancel { background-color: #ef4444; }
        .btn-cashout { background-color: #eab308; color: #000; }

        .wallet-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #cbd5e1;
            padding: 0 4px;
        }
        .wallet-amount {
            color: #4ade80;
            font-weight: bold;
        }

        /* Number pad overlay */
        .numpad-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111b36;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            display: none;
            z-index: 100;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
            border-top: 1px solid #2a3d73;
        }
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .num-key {
            background: #1c2a54;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .num-key:active { background: #334885; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="top-bar">
        <div class="history-list" id="historyList">
            <div class="history-pill low">1.20x</div>
            <div class="history-pill">2.45x</div>
            <div class="history-pill high">1.08x</div>
        </div>
        <button class="menu-btn" onclick="alert('Menu Options')">☰</button>
    </div>

    <div class="stage-area" id="stageArea">
        <div class="stars"></div>
        <div class="clouds"></div>
        <div class="user-tag">Mamun</div>
        
        <div class="plane-container" id="planeContainer">
            <div class="plane"></div>
        </div>

        <div class="multiplier-display" id="multiplierDisplay">0.00x</div>
        <div class="status-text" id="statusText">Place Your Bet</div>
    </div>

    <div class="control-panel">
        <div class="bet-row">
            <div class="bet-input-box" onclick="openNumpad()">
                <span class="currency-icon">🪙</span>
                <input type="text" id="betInput" class="bet-input" value="1" readonly>
            </div>
            <div class="bet-modifiers">
                <button class="mod-btn" onclick="setBet(1)">1/2</button>
                <button class="mod-btn" onclick="setBet(2)">2x</button>
            </div>
        </div>

        <div class="auto-row">
            <span>Auto CashOut: <span id="autoVal">3.00x</span></span>
            <label class="switch">
                <input type="checkbox" id="autoToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <button class="action-btn btn-bet" id="actionBtn" onclick="handleActionButton()">Bet</button>

        <div class="wallet-display">
            <span>Round ID: <span id="roundId">1002101021426511</span></span>
            <span>Balance: <span class="wallet-amount" id="balanceDisplay">$1000.00</span></span>
        </div>
    </div>

    <div class="numpad-modal" id="numpadModal">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span>Enter your bet amount</span>
            <button onclick="closeNumpad()" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;">✕</button>
        </div>
        <div class="numpad-grid">
            <button class="num-key" onclick="appendNum('1')">1</button>
            <button class="num-key" onclick="appendNum('2')">2</button>
            <button class="num-key" onclick="appendNum('3')">3</button>
            <button class="num-key" onclick="appendNum('4')">4</button>
            <button class="num-key" onclick="appendNum('5')">5</button>
            <button class="num-key" onclick="appendNum('6')">6</button>
            <button class="num-key" onclick="appendNum('7')">7</button>
            <button class="num-key" onclick="appendNum('8')">8</button>
            <button class="num-key" onclick="appendNum('9')">9</button>
            <button class="num-key" onclick="appendNum('.')">.</button>
            <button class="num-key" onclick="appendNum('0')">0</button>
            <button class="num-key" onclick="backspaceNum()">⌫</button>
        </div>
        <button class="action-btn btn-bet" style="margin-top:15px;" onclick="closeNumpad()">OK</button>
    </div>
</div>

<script>
    let balance = 1000.00;
    let betAmount = 1.00;
    let gameState = 'IDLE'; // IDLE, COUNTDOWN, FLYING, CRASHED, CASHED_OUT
    let currentMultiplier = 1.00;
    let crashPoint = 1.00;
    let countdownTimer = 5.00;
    let timerInterval = null;
    let flightInterval = null;

    const multiplierDisplay = document.getElementById('multiplierDisplay');
    const statusText = document.getElementById('statusText');
    const actionBtn = document.getElementById('actionBtn');
    const balanceDisplay = document.getElementById('balanceDisplay');
    const betInput = document.getElementById('betInput');
    const planeContainer = document.getElementById('planeContainer');
    const autoToggle = document.getElementById('autoToggle');

    function updateBalance() {
        balanceDisplay.textContent = `$${balance.toFixed(2)}`;
    }

    function setBet(multiplier) {
        if (gameState !== 'IDLE' && gameState !== 'COUNTDOWN') return;
        let val = parseFloat(betInput.value);
        if (multiplier === 1) val = Math.max(1, val / 2);
        if (multiplier === 2) val = val * 2;
        betInput.value = val;
        betAmount = val;
    }

    function openNumpad() {
        document.getElementById('numpadModal').style.display = 'block';
    }
    function closeNumpad() {
        document.getElementById('numpadModal').style.display = 'none';
        betAmount = parseFloat(betInput.value) || 1;
    }
    function appendNum(char) {
        if (betInput.value === '1' && char !== '.') {
            betInput.value = char;
        } else {
            betInput.value += char;
        }
    }
    function backspaceNum() {
        betInput.value = betInput.value.slice(0, -1) || '0';
    }

    function handleActionButton() {
        if (gameState === 'IDLE' || gameState === 'COUNTDOWN') {
            if (balance < betAmount) {
                alert('Insufficient Balance!');
                return;
            }
            balance -= betAmount;
            updateBalance();
            actionBtn.textContent = 'Cancel Bet';
            actionBtn.className = 'action-btn btn-cancel';
            gameState = 'BET_PLACED';
        } else if (gameState === 'BET_PLACED') {
            balance += betAmount;
            updateBalance();
            actionBtn.textContent = 'Bet';
            actionBtn.className = 'action-btn btn-bet';
            gameState = 'COUNTDOWN';
        } else if (gameState === 'FLYING') {
            // Manual Cash Out
            let winAmount = betAmount * currentMultiplier;
            balance += winAmount;
            updateBalance();
            statusText.textContent = `Won $${winAmount.toFixed(2)}`;
            actionBtn.textContent = `Won $${winAmount.toFixed(2)}`;
            actionBtn.className = 'action-btn btn-cashout';
            actionBtn.disabled = true;
            gameState = 'CASHED_OUT';
        }
    }

    // Game loop control
    function startCountdown() {
        gameState = 'COUNTDOWN';
        countdownTimer = 4.00;
        multiplierDisplay.textContent = '0.00x';
        planeContainer.style.display = 'none';
        if (gameState !== 'BET_PLACED') {
            actionBtn.textContent = 'Bet';
            actionBtn.className = 'action-btn btn-bet';
            actionBtn.disabled = false;
        }

        timerInterval = setInterval(() => {
            countdownTimer -= 0.1;
            if (countdownTimer <= 0) {
                clearInterval(timerInterval);
                startFlight();
            } else {
                statusText.textContent = `Next Round in ${countdownTimer.toFixed(1)}s`;
            }
        }, 100);
    }

    function startFlight() {
        gameState = 'FLYING';
        currentMultiplier = 1.00;
        crashPoint = (Math.random() * 3 + 1.2).toFixed(2); // Random crash between 1.2x and 4.2x
        planeContainer.style.display = 'block';
        statusText.textContent = 'FLYING...';

        if (actionBtn.classList.contains('btn-cancel') || actionBtn.classList.contains('btn-bet') === false) {
            actionBtn.textContent = 'Cash Out';
            actionBtn.className = 'action-btn btn-cashout';
        }

        flightInterval = setInterval(() => {
            currentMultiplier += 0.03;
            multiplierDisplay.textContent = `${currentMultiplier.toFixed(2)}x`;

            // Update button text if bet was placed
            if (gameState === 'FLYING' && actionBtn.classList.contains('btn-cashout')) {
                let currentWin = (betAmount * currentMultiplier).toFixed(2);
                actionBtn.textContent = `Cash Out $${currentWin}`;
            }

            // Auto Cashout check
            if (autoToggle.checked && currentMultiplier >= 3.00 && gameState === 'FLYING' && actionBtn.classList.contains('btn-cashout') && gameState !== 'CASHED_OUT') {
                // Trigger auto cashout
                let winAmount = betAmount * 3.00;
                balance += winAmount;
                updateBalance();
                statusText.textContent = `Won $${winAmount.toFixed(2)}`;
                actionBtn.textContent = `Won $${winAmount.toFixed(2)}`;
                gameState = 'CASHED_OUT';
            }

            if (currentMultiplier >= parseFloat(crashPoint)) {
                clearInterval(flightInterval);
                triggerCrash();
            }
        }, 100);
    }

    function triggerCrash() {
        gameState = 'CRASHED';
        planeContainer.style.display = 'none';
        statusText.textContent = 'CRASHED';
        multiplierDisplay.style.color = '#ef4444';
        
        if (actionBtn.classList.contains('btn-cashout') && gameState !== 'CASHED_OUT') {
            actionBtn.textContent = 'Crashed';
            actionBtn.className = 'action-btn btn-cancel';
            actionBtn.disabled = true;
        }

        setTimeout(() => {
            multiplierDisplay.style.color = '#ffffff';
            startCountdown();
        }, 3000);
    }

    // Initialize
    updateBalance();
    startCountdown();
</script>

</body>
</html>
