<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Retro Action Game - Mustafa Style</title>
    <style>
        body { background: #0b0b0b; color: #fff; text-align: center; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 0; overflow: hidden; }
        #game-wrapper { position: relative; width: 100%; max-width: 800px; height: 450px; margin: 10px auto; background: #1a1a1a; border: 4px solid #ff9800; border-radius: 8px; box-shadow: 0 0 20px rgba(255,152,0,0.5); }
        #hud { display: flex; justify-content: space-between; background: rgba(0,0,0,0.8); padding: 8px 15px; font-size: 16px; font-weight: bold; border-bottom: 2px solid #444; }
        canvas { display: block; background: #222; width: 100%; height: 350px; }
        
        /* কন্ট্রোল প্যানেল ও বাটন ডিজাইন */
        #controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #111; }
        .d-pad, .action-pad { display: flex; gap: 10px; }
        .arcade-btn { width: 55px; height: 55px; background: #ff9800; border: 3px solid #fff; border-radius: 50%; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; box-shadow: 0 4px 0 #b76800; }
        .arcade-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #b76800; }
        .shoot-btn { background: #e91e63; box-shadow: 0 4px 0 #9c1341; }
        .special-btn { background: #9c27b0; box-shadow: 0 4px 0 #5e156b; }

        /* পপআপ মডাল */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #222; padding: 30px; border: 3px solid #ff9800; border-radius: 12px; text-align: center; max-width: 350px; }
        .modal-btn { padding: 12px 25px; font-size: 18px; background: #e91e63; border: none; color: white; cursor: pointer; font-weight: bold; border-radius: 6px; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="hud">
            <div>বেট: <span id="bet-amount">১০০</span> ৳</div>
            <div>লাইভ: <span id="lives">❤️❤️❤️❤️❤️</span></div>
            <div>স্টেজ: <span id="stage">১</span> (মাল্টিপ্লায়ার: <span id="multiplier">১x</span>)</div>
        </div>
        <canvas id="gameCanvas" width="800" height="350"></canvas>
    </div>

    <!-- গেম কন্ট্রোলস (মোবাইল ও ডেস্কটপ ফ্রেন্ডলি গোল বাটন) -->
    <div id="controls">
        <div class="d-pad">
            <button class="arcade-btn" onclick="movePlayer('left')">◀</button>
            <button class="arcade-btn" onclick="movePlayer('right')">▶</button>
        </div>
        <div class="action-pad">
            <button class="arcade-btn special-btn" onclick="specialPower()">⭐</button>
            <button class="arcade-btn shoot-btn" onclick="shoot()">🔫</button>
        </div>
    </div>

    <!-- লাইভ কেনার পপআপ উইন্ডো -->
    <div id="modal">
        <div class="modal-content">
            <h2 style="color: #e91e63;">আপনি মারা গেছেন!</h2>
            <p>খেলা চালিয়ে যেতে ১০ টাকা দিয়ে ১টি লাইভ কিনুন এবং বিজয়ের দিকে এগিয়ে যান।</p>
            <button class="modal-btn" onclick="buyLife()">১০ টাকায় লাইভ কিনুন</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 100, y: 250, width: 40, height: 70, speed: 15 };
    let enemy = { x: 700, y: 250, width: 40, height: 70, hp: 3 };
    let bullets = [];
    
    let balance = 1000;
    let bet = 100;
    let lives = 5;
    let currentStage = 1;
    let multiplier = 1;

    function updateHUD() {
        document.getElementById("bet-amount").innerText = bet;
        document.getElementById("lives").innerText = "❤️".repeat(lives);
        document.getElementById("stage").innerText = currentStage;
        document.getElementById("multiplier").innerText = multiplier + "x";
    }

    function movePlayer(dir) {
        if (dir === 'left' && player.x > 20) player.x -= player.speed;
        if (dir === 'right' && player.x < canvas.width - 60) player.x += player.speed;
    }

    function shoot() {
        bullets.push({ x: player.x + player.width, y: player.y + 25, width: 12, height: 6, speed: 12 });
    }

    function specialPower() {
        // স্পেশাল অ্যাটাক যা শত্রুর বড় ক্ষতি করবে
        enemy.hp -= 2;
        checkEnemyStatus();
    }

    function checkEnemyStatus() {
        if (enemy.hp <= 0) {
            if (currentStage < 5) {
                alert(`অভিনন্দন! স্টেজ ${currentStage} পার করেছেন। মাল্টিপ্লায়ার এখন ${currentStage + 1}x!`);
                currentStage++;
                multiplier = currentStage;
                enemy.hp = 3 + currentStage; // পরবর্তী স্টেজে শত্রু শক্তিশালী হবে
                enemy.x = 700;
            } else {
                let winAmount = bet * multiplier;
                balance += winAmount;
                alert(`🎉 অসাধারণ! আপনি ফাইনাল স্টেজ পার করে ${winAmount} টাকা জিতেছেন!`);
                currentStage = 1;
                multiplier = 1;
                lives = 5;
                enemy.hp = 3;
            }
            updateHUD();
        }
    }

    function playerDies() {
        lives--;
        updateHUD();
        if (lives <= 0) {
            document.getElementById("modal").style.display = "flex";
        }
    }

    function buyLife() {
        if (balance >= 10) {
            balance -= 10;
            lives = 3; // নতুন লাইভ যোগ হলো
            document.getElementById("modal").style.display = "none";
            updateHUD();
        } else {
            alert("আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
        }
    }

    function gameLoop() {
        // ব্যাকগ্রাউন্ড ড্র (পোস্ট-অ্যাপোক্যালিপ্টিক সিটি ও ফায়ার এফেক্ট ভাইব)
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // ফায়ার বা বার ব্যাকগ্রাউন্ড ডিটেইলস
        ctx.fillStyle = "#ff3d00";
        ctx.fillRect(50, 80, 100, 150); // বার বিল্ডিং
        ctx.fillStyle = "#ffeb3b";
        ctx.font = "14px Courier New";
        ctx.fillText("BAR", 80, 150);

        ctx.fillStyle = "#9c27b0";
        ctx.fillRect(600, 50, 120, 180); // হোটেল বিল্ডিং
        ctx.fillStyle = "#fff";
        ctx.fillText("HOTEL", 635, 130);

        // ফায়ার অ্যানিমেশন পার্টিকেল বা ইফেক্ট
        ctx.fillStyle = Math.random() > 0.5 ? "#ff9800" : "#ff5722";
        ctx.fillRect(80, 60, 20, 30);
        ctx.fillRect(650, 30, 25, 35);

        // প্লেয়ার ড্র
        ctx.fillStyle = "#00bcd4";
        ctx.fillRect(player.x, player.y, player.width, player.height);

        // শত্রু ড্র (ভিলেন)
        ctx.fillStyle = currentStage === 5 ? "#9c27b0" : "#e91e63"; // ৫ নম্বর স্টেজে ড্রাগন/বস লুক
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

        // বুলেট আপডেট ও ড্র
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.speed;
            ctx.fillStyle = '#ffeb3b';
            ctx.fillRect(b.x, b.y, b.width, b.height);

            // শত্রুর সাথে সংঘর্ষ চেক
            if (b.x > enemy.x && b.y > enemy.y && b.y < enemy.y + enemy.height) {
                bullets.splice(i, 1);
                enemy.hp--;
                checkEnemyStatus();
            } else if (b.x > canvas.width) {
                bullets.splice(i, 1);
            }
        }

        // সিমুলেটেড শত্রু আক্রমণ (মাঝে মাঝে প্লেয়ারের লাইভ কমবে)
        if (Math.random() < 0.003) {
            playerDies();
        }

        requestAnimationFrame(gameLoop);
    }

    updateHUD();
    gameLoop();
</script>

</body>
</html>
