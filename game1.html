<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Game Template - Master API Connected</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #060913;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .game-container {
            width: 100%;
            max-width: 450px;
            background: #0f172a;
            border-radius: 16px;
            border: 1px solid #1e293b;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        .screen {
            background: #020617;
            height: 200px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .multiplier {
            font-size: 42px;
            font-weight: bold;
            color: #00ffcc;
        }
        .status {
            font-size: 14px;
            color: #f59e0b;
            margin-top: 5px;
            text-transform: uppercase;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            text-align: center;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #00ffcc;
            color: #060913;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #00b388; }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>BX Universal Game UI</h2>
        <p style="font-size: 12px; color: #64748b; margin-bottom: 15px;">Connected to Master Aggregator API</p>

        <div class="screen">
            <div class="multiplier" id="display-multiplier">1.00x</div>
            <div class="status" id="display-status">Connecting to Master Engine...</div>
        </div>

        <div class="controls">
            <input type="number" id="stake-input" value="10" min="1">
            <button id="action-btn" onclick="handleAction()">PLACE BET</button>
        </div>

        <div style="margin-top: 15px; font-size: 14px;">
            Wallet Balance: <span id="wallet-balance" style="color: #00ffcc; font-weight: bold;">$1000.00</span>
        </div>

        <a href="index.html" class="back-link">← Back to Lobby</a>
    </div>

    <!-- মাস্টার এপিআই ফাইল কানেকশন -->
    <script src="master-api.js"></script>
    <script>
        // Master API Initialization for this specific UI template
        const api = new BXMasterAggregatorAPI("https://bsc-dataseed.binance.org/", "0xYourSmartContractAddressHere", "0xYourPrivateKeyHere");

        let isBetActive = false;

        async function handleAction() {
            let stake = parseFloat(document.getElementById('stake-input').value);
            let btn = document.getElementById('action-btn');

            if (!isBetActive) {
                // Call Master API for Bet Transaction
                let res = await api.processGameTransaction("token123", "game1", "CRASH", "BET", stake);
                if (res.status === "SUCCESS") {
                    isBetActive = true;
                    document.getElementById('wallet-balance').innerText = "$" + res.remainingBalance.toFixed(2);
                    btn.innerText = "CASH OUT";
                    btn.style.background = "#f59e0b";
                    document.getElementById('display-status').innerText = "Game in progress...";
                }
            } else {
                // Call Master API for Cash Out / Win Settlement (e.g. at 2.00x multiplier)
                let res = await api.processGameTransaction("token123", "game1", "CRASH", "WIN", stake, 2.00);
                if (res.status === "SUCCESS") {
                    isBetActive = false;
                    document.getElementById('wallet-balance').innerText = "$" + (1000 + res.payout).toFixed(2);
                    btn.innerText = "PLACE BET";
                    btn.style.background = "#00ffcc";
                    document.getElementById('display-status').innerText = `Won $${res.payout}!`;
                }
            }
        }
    </script>
</body>
</html>
