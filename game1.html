<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BX Ultimate Retro Arcade - Mustafa Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            color: #fff; 
            text-align: center; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
            touch-action: none;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ফুলস্ক্রিন ল্যান্ডস্কেপ গেম কন্টেইনার */
        #game-wrapper { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #111;
            overflow: hidden;
        }

        /* হিউড বা স্ট্যাটাস বার (উপরে ওভারলে) */
        #hud { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex; 
            justify-content: space-between; 
            background: rgba(0, 0, 0, 0.75); 
            padding: 8px 20px; 
            font-size: 15px; 
            font-weight: bold; 
            z-index: 10;
            border-bottom: 2px solid #ff9800;
        }

        /* ফুল স্ক্রিন ক্যানভাস */
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }

        /* ভিডিওর মতো নিখুঁত গোল ও স্টাইলিশ টাচ কন্ট্রোলস (যাতে ভুল টাচ না লাগে) */
        #controls { 
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 25px; 
            z-index: 10;
            pointer-events: none; /* ব্যাকগ্রাউন্ডে টাচ যাতে পাস না হয় */
        }

        .d-pad, .action-pad { 
            display: flex; 
            gap: 15px; 
            pointer-events: auto;
        }

        .arcade-btn { 
            width: 65px; 
            height: 65px; 
            background: rgba(255, 152, 0, 0.85); 
            border: 3px solid #fff; 
            border-radius: 50%; 
            color: #fff; 
            font-size: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            user-select: none; 
            box-shadow: 0 5px 0 #b76800; 
            text-transform: uppercase;
        }
        .arcade-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b76800; }
        
        .shoot-btn { background: rgba(233, 30, 99, 0.9); box-shadow: 0 5px 0 #9c1341; width: 70px; height: 70px; }
        .jump-btn { background: rgba(76, 175, 80, 0.9); box-shadow: 0 5px 0 #2e7d32; width: 70px; height: 70px; }
        .special-btn { background: rgba(156, 39, 176, 0.9); box-shadow: 0 5px 0 #5e156b; width: 60px; height: 60px; }

        /* লাইভ কেনার পপআপ মডাল */
        #modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.9); 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
        }
        .modal-content { 
            background: #1a1a1a; 
            padding: 30px; 
            border: 4px solid #ff9800; 
            border-radius: 12px; 
            text-align: center; 
            max-width: 380px; 
        }
        .modal-btn { 
            padding: 12px 30px; 
            font-size: 18px; 
            background: #e91e63; 
            border: none; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 6px; 
            margin-top: 15px; 
            box-shadow: 0 4px 0 #9c1341;
        }
        .modal-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #9c1341; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="hud">
            <div>বেট: <span id="bet-amount">১০০</span> ৳</div>
            <div>লাইভ: <span id="lives">❤️❤️❤️❤️❤️</span></div>
            <div>স্টেজ: <span id="stage">১</span> (মাল্টিপ্লায়ার: <span id="multiplier">১x</span>)</div>
        </div>
        <canvas id="gameCanvas"></canvas>

        <!-- ভিডিওর মতো লেআউট করা কন্ট্রোল বাটন -->
        <div id="controls">
            <div class="d-pad">
                <button class="arcade-btn" ontouchstart="movePlayer('left')" onmousedown="movePlayer('left')" ontouchend="stopPlayer()" onmouseup="stopPlayer()">LEFT</button>
                <button class="arcade-btn" ontouchstart="movePlayer('right')" onmousedown="movePlayer('right')" ontouchend="stopPlayer()" onmouseup="stopPlayer()">RIGHT</button>
            </div>
            <div class="action-pad">
                <button class="arcade-btn special-btn" onclick="specialPower()">SPECIAL</button>
                <button class="arcade-btn jump-btn" onclick="jumpPlayer()">JUMP</button>
                <button class="arcade-btn shoot-btn" onclick="shoot()">SHOOT</button>
            </div>
        </div>
    </div>

    <!-- লাইভ কেনার পপআপ উইন্ডো -->
    <div id="modal">
        <div class="modal-content">
            <h2 style="color: #e91e63; margin-bottom: 10px;">আপনি মারা গেছেন!</h2>
            <p style="font-size: 14px; line-height: 1.5;">খেলা চালিয়ে যেতে এবং আপনার মূল বেট টিকিয়ে রাখতে ১০ টাকা দিয়ে ১টি লাইভ কিনুন।</p>
            <button class="modal-btn" onclick="buyLife()">১০ টাকায় লাইভ কিনুন</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ফুলস্ক্রিন অটো রিসাইজ
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // গেম অবজেক্ট ও ভেরিয়েবল
    let player = { x: 100, y: canvas.height - 180, width: 50, height: 90, vx: 0, speed: 6, isJumping: false };
    let enemy = { x: canvas.width - 200, y: canvas.height - 190, width: 60, height: 95, hp: 5 };
    let bullets = [];
    let fireParticles = [];

    let balance = 1000;
    let bet = 100;
    let lives = 5;
    let currentStage = 1;
    let multiplier = 1;

    // ফায়ার পার্টিকেল জেনারেটর (ভিডিওর মতো ব্যাকগ্রাউন্ড আগুন ও ধোঁয়া)
    for(let i=0; i<15; i++) {
        fireParticles.push({
            x: Math.random() * canvas.width,
            y: canvas.height - 250 - Math.random() * 100,
            size: Math.random() * 25 + 10,
            speedY: Math.random() * 2 + 1,
            color: Math.random() > 0.5 ? '#ff3d00' : '#ff9800'
        });
    }

    function updateHUD() {
        document.getElementById("bet-amount").innerText = bet;
        document.getElementById("lives").innerText = "❤️".repeat(lives > 0 ? lives : 0);
        document.getElementById("stage").innerText = currentStage;
        document.getElementById("multiplier").innerText = multiplier + "x";
    }

    function movePlayer(dir) {
        if (dir === 'left') player.vx = -player.speed;
        if (dir === 'right') player.vx = player.speed;
    }

    function stopPlayer() {
        player.vx = 0;
    }

    function jumpPlayer() {
        if (!player.isJumping) {
            player.isJumping = true;
            let jumpCount = 0;
            let jumpInterval = setInterval(() => {
                player.y -= 12;
                jumpCount++;
                if (jumpCount > 12) {
                    clearInterval(jumpInterval);
                    let fallInterval = setInterval(() => {
                        player.y += 12;
                        jumpCount--;
                        if (jumpCount <= 0) {
                            clearInterval(fallInterval);
                            player.isJumping = false;
                        }
                    }, 25);
                }
            }, 25);
        }
    }

    function shoot() {
        bullets.push({ x: player.x + player.width, y: player.y + 30, width: 15, height: 6, speed: 15 });
    }

    function specialPower() {
        enemy.hp -= 3;
        checkEnemyStatus();
    }

    function checkEnemyStatus() {
        if (enemy.hp <= 0) {
            if (currentStage < 5) {
                alert(`অভিনন্দন! স্টেজ ${currentStage} পার করেছেন। মাল্টিপ্লায়ার এখন ${currentStage + 1}x!`);
                currentStage++;
                multiplier = currentStage;
                enemy.hp = 5 + (currentStage * 3); // ডিফিকাল্টি বৃদ্ধি
                enemy.x = canvas.width - 250;
            } else {
                let winAmount = bet * multiplier;
                balance += winAmount;
                alert(`🎉 অসাধারণ! আপনি ফাইনাল স্টেজ পার করে বিশাল ড্রাগন বসকে হারিয়ে ${winAmount} টাকা জিতেছেন!`);
                currentStage = 1;
                multiplier = 1;
                lives = 5;
                enemy.hp = 5;
            }
            updateHUD();
        }
    }

    function playerDies() {
        lives--;
        updateHUD();
        if (lives <= 0) {
            document.getElementById("modal").style.display = "flex";
        }
    }

    function buyLife() {
        if (balance >= 10) {
            balance -= 10;
            lives = 3; 
            document.getElementById("modal").style.display = "none";
            updateHUD();
        } else {
            alert("আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
        }
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // ১. ডাইনামিক পোস্ট-অ্যাপোক্যালিপ্টিক সিটি ব্যাকগ্রাউন্ড
        let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "#120524");
        gradient.addColorStop(0.6, "#2c163a");
        gradient.addColorStop(1, "#111");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // বিল্ডিং ও নিয়ন সাইন ("BAR", "HOTEL")
        ctx.fillStyle = "#1b1b2f";
        ctx.fillRect(80, canvas.height - 350, 180, 260);
        ctx.fillStyle = "#ff3d00";
        ctx.font = "bold 16px Courier New";
        ctx.fillText("BAR", 150, canvas.height - 220);

        ctx.fillStyle = "#251233";
        ctx.fillRect(canvas.width - 320, canvas.height - 380, 220, 290);
        ctx.fillStyle = "#00e5ff";
        ctx.fillText("HOTEL", canvas.width - 230, canvas.height - 240);

        // ৫ নম্বর স্টেজের জন্য বিশাল ড্রাগন বস ব্যাকগ্রাউন্ড ভাইব
        if (currentStage === 5) {
            ctx.fillStyle = "rgba(156, 39, 176, 0.25)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff5722";
            ctx.font = "bold 24px Courier New";
            ctx.fillText("⚡ FINAL BOSS: PURPLE DRAGON ⚡", canvas.width / 2 - 180, 70);
        }

        // ফায়ার ও স্মোক ইফেক্ট অ্যানিমেশন
        fireParticles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            p.y -= p.speedY;
            if (p.y < canvas.height - 380) p.y = canvas.height - 150;
        });

        // রাস্তা বা গ্রাউন্ড লেভেল
        ctx.fillStyle = "#1e1e1e";
        ctx.fillRect(0, canvas.height - 90, canvas.width, 90);
        ctx.fillStyle = "#ff9800";
        ctx.fillRect(0, canvas.height - 95, canvas.width, 5);

        // প্লেয়ার মুভমেন্ট আপডেট
        player.x += player.vx;
        if (player.x < 20) player.x = 20;
        if (player.x > canvas.width - 80) player.x = canvas.width - 80;

        // ২. প্লেয়ার ড্র (হিরো উইথ গান)
        ctx.fillStyle = "#00bcd4";
        ctx.fillRect(player.x, player.y, player.width, player.height);
        // হিরোর জ্যাকেট ও মাথার ডিটেইল
        ctx.fillStyle = "#e91e63";
        ctx.fillRect(player.x + 5, player.y + 15, player.width - 10, 40);
        ctx.fillStyle = "#fff";
        ctx.fillRect(player.x + player.width - 10, player.y + 35, 20, 8); // বন্দুক

        // ৩. শত্রু / বস ড্র (স্টেজ অনুযায়ী পরিবর্তিত লুক)
        ctx.fillStyle = currentStage === 5 ? "#7b1fa2" : "#c2185b"; 
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
        ctx.fillStyle = "#ffeb3b";
        ctx.fillRect(enemy.x + 10, enemy.y + 10, 15, 6); // শত্রুর চোখ

        // বুলেট আপডেট ও ড্র
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.speed;
            ctx.fillStyle = '#ffeb3b';
            ctx.fillRect(b.x, b.y, b.width, b.height);

            // শত্রুর সাথে বুলেটের সংঘর্ষ
            if (b.x > enemy.x && b.y > enemy.y && b.y < enemy.y + enemy.height) {
                bullets.splice(i, 1);
                enemy.hp--;
                checkEnemyStatus();
            } else if (b.x > canvas.width) {
                bullets.splice(i, 1);
            }
        }

        // র্যান্ডম ড্যামেজ বা লাইভ কমার সিস্টেম
        if (Math.random() < 0.002 && lives > 0 && document.getElementById("modal").style.display !== "flex") {
            playerDies();
        }

        requestAnimationFrame(gameLoop);
    }

    updateHUD();
    gameLoop();
</script>

</body>
</html>
