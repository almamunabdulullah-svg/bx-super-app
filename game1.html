<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator - Real Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: Arial, sans-serif; }
        .glow { text-shadow: 0 0 20px rgba(239, 68, 68, 0.8); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 max-w-md mx-auto">

    <!-- Top Header -->
    <header class="flex justify-between items-center bg-gray-900 px-4 py-2.5 rounded-xl border border-gray-800">
        <div class="text-red-500 font-black italic text-lg tracking-wider">Aviator</div>
        <div class="flex items-center gap-2">
            <span class="text-yellow-500 text-sm">🪙</span>
            <span id="user-balance" class="font-bold text-green-400 text-sm">0.00 INR</span>
        </div>
    </header>

    <!-- Fun Mode Banner -->
    <div class="bg-amber-600 text-black font-bold text-center text-xs py-1 rounded-md my-2 tracking-widest uppercase">
        FUN MODE
    </div>

    <!-- Game Screen / Multiplier Area -->
    <div class="relative w-full h-56 bg-gray-950 rounded-xl border border-gray-800 flex flex-col items-center justify-center overflow-hidden shadow-inner my-1">
        <div id="multiplier" class="text-5xl font-black glow text-white tracking-wide">
            1.00 x
        </div>
        <div class="absolute bottom-3 left-3 text-red-500 text-2xl">
            ✈️
        </div>
    </div>

    <!-- Dual Betting Panels (Matching the screenshot exactly) -->
    <div class="flex flex-col gap-3 my-2">
        <!-- Bet Panel 1 -->
        <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 flex flex-col gap-2">
            <div class="flex justify-between text-xs text-gray-400">
                <span class="bg-gray-800 px-2 py-0.5 rounded text-gray-300 font-semibold">Bet</span>
                <span class="bg-gray-800 px-2 py-0.5 rounded text-gray-400">Auto</span>
            </div>
            <div class="flex items-center justify-between bg-gray-800 rounded-lg px-3 py-1.5 border border-gray-700">
                <button onclick="adjustBet(1, -10)" class="text-gray-400 font-bold text-lg">-</button>
                <span id="bet-val-1" class="font-bold text-sm">20</span>
                <button onclick="adjustBet(1, 10)" class="text-gray-400 font-bold text-lg">+</button>
            </div>
            <div class="grid grid-cols-4 gap-1.5 text-center text-[11px]">
                <div onclick="setBet(1, 20)" class="bg-gray-800 py-1 rounded text-gray-300 cursor-pointer">20</div>
                <div onclick="setBet(1, 50)" class="bg-gray-800 py-1 rounded text-gray-300 cursor-pointer">50</div>
                <div onclick="setBet(1, 100)" class="bg-gray-800 py-1 rounded text-gray-300 cursor-pointer">100</div>
                <div onclick="setBet(1, 1000)" class="bg-gray-800 py-1 rounded text-gray-300 cursor-pointer">1000</div>
            </div>
            <button onclick="handleBet(1)" id="btn-1" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-sm tracking-wide shadow-md transition">
                BET 20.00 INR
            </button>
        </div>

        <!-- Bet Panel 2 -->
        <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 flex flex-col gap-2">
            <div class="flex justify-between text-xs text-gray-400">
                <span class="bg-gray-800 px-2 py-0.5 rounded text-gray-300 font-semibold">Bet</span>
                <span class="bg-gray-800 px-2 py-0.5 rounded text-gray-400">Auto</span>
            </div>
            <div class="flex items-center justify-between bg-gray-800 rounded-lg px-3 py-1.5 border border-gray-700">
                <button onclick="adjustBet(2, -10)" class="text-gray-400 font-bold text-lg">-</button>
                <span id="bet-val-2" class="font-bold text-sm">20</span>
                <button onclick="adjustBet(2, 10)" class="text-gray-400 font-bold text-lg">+</button>
            </div>
            <div class="grid grid-cols-4 gap-1.5 text-center text-[11px]">
                <div onclick="setBet(2, 20)" class="bg-gray-800 py-1 rounded text-gray-300 cursor-pointer">20</div>
                <div onclick="setBet(2, 50)" class="bg-gray-800 py-1 rounded text-gray-300 cursor-pointer">50</div>
                <div onclick="setBet(2, 100)" class="bg-gray-800 py-1 rounded text-gray-300 cursor-pointer">100</div>
                <div onclick="setBet(2, 1000)" class="bg-gray-800 py-1 rounded text-gray-300 cursor-pointer">1000</div>
            </div>
            <button onclick="handleBet(2)" id="btn-2" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-sm tracking-wide shadow-md transition">
                BET 20.00 INR
            </button>
        </div>
    </div>

    <!-- Bottom Telegram Contact / Footer Button -->
    <div class="mt-2">
        <a href="https://telegram.org" target="_blank" class="block w-full bg-blue-600 hover:bg-blue-700 text-white text-center font-bold py-3 rounded-xl text-sm shadow-lg transition">
            Contact Me Telegram
        </a>
    </div>

    <!-- Backend Link Scripts -->
    <script src="master-api.js"></script>
    <script src="script.js"></script>
    <script>
        let bets = { 1: 20, 2: 20 };
        let gameRunning = { 1: false, 2: false };

        function setBet(panel, amount) {
            bets[panel] = amount;
            document.getElementById(`bet-val-${panel}`).innerText = amount;
            document.getElementById(`btn-${panel}`).innerText = `BET ${amount}.00 INR`;
        }

        function adjustBet(panel, change) {
            bets[panel] = Math.max(10, bets[panel] + change);
            document.getElementById(`bet-val-${panel}`).innerText = bets[panel];
            document.getElementById(`btn-${panel}`).innerText = `BET ${bets[panel]}.00 INR`;
        }

        function handleBet(panel) {
            let btn = document.getElementById(`btn-${panel}`);
            if (!gameRunning[panel]) {
                gameRunning[panel] = true;
                btn.innerText = "CASHOUT";
                btn.className = "w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 rounded-lg text-sm tracking-wide shadow-md transition";
                
                // Simulation of multiplier growth
                let progress = 1.00;
                let interval = setInterval(() => {
                    progress += 0.03;
                    document.getElementById('multiplier').innerText = progress.toFixed(2) + " x";
                    if (Math.random() < 0.015 && progress > 1.3) {
                        clearInterval(interval);
                        document.getElementById('multiplier').innerText = "CRASHED";
                        setTimeout(() => resetPanel(panel), 2000);
                    }
                }, 200);
            } else {
                resetPanel(panel);
            }
        }

        function resetPanel(panel) {
            gameRunning[panel] = false;
            let btn = document.getElementById(`btn-${panel}`);
            btn.innerText = `BET ${bets[panel]}.00 INR`;
            btn.className = "w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-sm tracking-wide shadow-md transition";
        }
    </script>
</body>
</html>
