<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Turbo Crash - Afterburner Flight</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #09090b;
            color: #f97316;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .turbo-app {
            width: 100%;
            max-width: 450px;
            background: #18181b;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #f9731644;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.2);
            display: flex;
            flex-direction: column;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #27272a;
            padding: 10px 15px;
            border-bottom: 1px solid #f9731633;
        }
        .brand { color: #f97316; font-weight: 900; font-style: italic; font-size: 18px; text-shadow: 0 0 10px #f97316; }
        .wallet { font-size: 13px; font-weight: bold; color: #4ade80; }
        
        .game-viewport {
            position: relative;
            width: 100%;
            height: 260px;
            background: radial-gradient(circle at center, #7c2d12 0%, #09090b 80%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #f9731633;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .center-info {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .mult-text {
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(249, 115, 22, 0.8);
        }
        .status-txt {
            font-size: 13px;
            font-weight: bold;
            color: #f97316;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background: #18181b;
        }
        .card {
            background: #27272a;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #f9731633;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .input-group {
            display: flex;
            align-items: center;
            background: #09090b;
            border-radius: 8px;
            border: 1px solid #f9731655;
            overflow: hidden;
            width: 130px;
        }
        .input-group button {
            background: #27272a;
            color: #f97316;
            border: none;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            outline: none;
        }
        .btn-turbo {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: 900;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            background: #f97316;
            color: #09090b;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
            transition: 0.2s;
        }
        .btn-turbo.cashout {
            background: #eab308;
            color: #09090b;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
        }
    </style>
</head>
<body>

    <div class="turbo-app">
        <div class="top-nav">
            <div class="brand">BX Turbo Jet</div>
            <div class="wallet" id="user-bal">1000.00 BDT</div>
        </div>

        <div class="game-viewport">
            <canvas id="turboCanvas"></canvas>
            <div class="center-info">
                <div class="mult-text" id="mult-view">0.00x</div>
                <div class="status-txt" id="status-view">AFTERBURNER READY</div>
            </div>
        </div>

        <div class="controls-area">
            <div class="card">
                <div class="row">
                    <div class="input-group">
                        <button onclick="adjust(-10)">-</button>
                        <input type="number" id="bet-in" value="50">
                        <button onclick="adjust(10)">+</button>
                    </div>
                    <button class="btn-turbo" id="action-btn" onclick="handleBet()">PLACE BET</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('turboCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let balance = 1000.00;
        let state = 'COUNTDOWN';
        let mult = 1.00;
        let crashAt = 1.00;
        let prog = 0;
        let cd = 5;
        let hasBet = false;
        let cashed = false;
        let stake = 50;
        let timer = null;

        function renderTurbo(m, s) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(249, 115, 22, 0.05)';
            ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=30) {
                ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }

            if(s === 'FLYING' || s === 'CRASHED') {
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                let px = prog * 2.2;
                let py = canvas.height - (prog * 1.1);
                ctx.quadraticCurveTo(px/2, canvas.height, px, Math.max(30, py));
                ctx.strokeStyle = s === 'CRASHED' ? '#dc2626' : '#f97316';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = s === 'CRASHED' ? '#dc2626' : '#f97316';
                ctx.beginPath(); ctx.arc(px, Math.max(30, py), 6, 0, Math.PI*2); ctx.fill();
            }
        }

        function runLoop() {
            state = 'COUNTDOWN';
            cd = 5;
            cashed = false;
            prog = 0;
            mult = 1.00;

            document.getElementById('mult-view').innerText = "0.00x";
            document.getElementById('status-view').innerText = `NEXT LAUNCH IN ${cd}s`;
            renderTurbo(1.00, 'COUNTDOWN');

            let cdTimer = setInterval(() => {
                cd--;
                if(cd > 0) {
                    document.getElementById('status-view').innerText = `NEXT LAUNCH IN ${cd}s`;
                } else {
                    clearInterval(cdTimer);
                    startLaunch();
                }
            }, 1000);
        }

        function startLaunch() {
            state = 'FLYING';
            crashAt = (Math.random() * 4.5 + 1.12).toFixed(2);

            timer = setInterval(() => {
                if(mult >= crashAt) {
                    clearInterval(timer);
                    state = 'CRASHED';
                    document.getElementById('mult-view').innerText = crashAt + "x";
                    document.getElementById('status-view').innerText = "ENGINE STALL";
                    renderTurbo(mult, 'CRASHED');

                    if(hasBet && !cashed) {
                        hasBet = false;
                        resetBtn();
                    }

                    setTimeout(runLoop, 3500);
                } else {
                    mult += 0.015;
                    prog += 2.0;
                    document.getElementById('mult-view').innerText = mult.toFixed(2) + "x";
                    document.getElementById('status-view').innerText = "ASCENDING...";
                    renderTurbo(mult, 'FLYING');
                }
            }, 40);
        }

        function adjust(val) {
            let input = document.getElementById('bet-in');
            let cur = parseFloat(input.value) || 0;
            if(cur + val >= 1) input.value = cur + val;
        }

        function handleBet() {
            let btn = document.getElementById('action-btn');
            stake = parseFloat(document.getElementById('bet-in').value);

            if((state === 'COUNTDOWN') && !hasBet) {
                if(stake > balance) return alert("Low balance!");
                balance -= stake;
                document.getElementById('user-bal').innerText = balance.toFixed(2) + " BDT";
                hasBet = true;
                cashed = false;

                btn.innerText = "LOCKED";
                btn.style.background = "#555";
            } else if(state === 'FLYING' && hasBet && !cashed) {
                cashed = true;
                let win = (stake * mult) * 0.98;
                balance += win;
                document.getElementById('user-bal').innerText = balance.toFixed(2) + " BDT";

                btn.innerText = `WON ${win.toFixed(0)}`;
                btn.className = "btn-turbo";
                hasBet = false;
            }
        }

        function resetBtn() {
            let btn = document.getElementById('action-btn');
            btn.innerText = "PLACE BET";
            btn.className = "btn-turbo";
            btn.style.background = "#f97316";
        }

        runLoop();
    </script>
</body>
</html>
