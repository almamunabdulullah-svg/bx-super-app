<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Game Arena - Live Casino & Crash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
    <div class="game-container">
        <header class="game-header">
            <button onclick="history.back()" class="back-btn">&larr; Back</button>
            <h2>BX Casino & Aviator Hub</h2>
        </header>
        
        <div class="game-lobby">
            <div class="game-card">
                <h3>Aviator Live Crash</h3>
                <div class="multiplier-box">
                    <span id="multiplier">1.00x</span>
                </div>
                <div class="bet-controls">
                    <input type="number" id="betAmount" placeholder="Bet Amount ($)" value="10">
                    <button class="play-btn" id="betBtn" onclick="placeCasinoBet()">Place Real Bet</button>
                </div>
            </div>
            
            <div class="game-card">
                <h3>Teen Patti Pro & Roulette Live</h3>
                <p>Smart Contract Settlement: Active</p>
                <button class="play-btn" onclick="alert('Connecting to Live Table Node...')">Join Table</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
