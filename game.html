<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Live Casino & Aviator Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
    <div class="game-container">
        <header class="game-header">
            <button onclick="history.back()" class="back-btn">&larr; Back</button>
            <h2>Live Game Arena (Real API Connected)</h2>
        </header>
        
        <div class="game-lobby">
            <!-- Aviator Crash Game Component -->
            <div class="game-card">
                <h3>Aviator Crash (Live Multiplier)</h3>
                <div class="multiplier-box">
                    <span id="multiplier">1.00x</span>
                </div>
                <div class="bet-controls">
                    <input type="number" id="betAmount" placeholder="Enter Bet (e.g. $10 / ৳1200)" value="10">
                    <button class="play-btn" id="betBtn" onclick="placeRealBet()">Place Real Bet</button>
                </div>
            </div>
            
            <div class="game-card">
                <h3>Teen Patti Pro & Dragon vs Tiger</h3>
                <p>Live Dealers & Instant Settlement Active</p>
                <button class="play-btn" onclick="alert('Connecting to Live Casino Server API...')">Join Live Table</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
